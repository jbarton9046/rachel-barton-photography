<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact | Rachel Barton Photography</title>
  <meta name="description" content="Say hello and tell me about your session ideas. I’d love to plan something beautiful with you." />

  <!-- Fonts (match about.html exactly: includes Raleway) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Shared layout (universal navbar + footer) -->
  <link rel="stylesheet" href="/assets/layout.css?v=nav-5">

  <!-- Desktop-only serif/centered Galleries dropdown (unchanged) -->
  <style>
    @media (min-width: 900px){
      .site-nav .submenu, .site-nav .dropdown, .topbar .submenu, .topbar .dropdown{
        background: transparent; border:0; box-shadow:none; padding:6px 0 10px; min-width:170px;
      }
      .site-nav .dropdown-title{
        font-family:"Cormorant Garamond","Playfair Display",Georgia,serif;
        font-weight:700; font-size:26px; line-height:1.1;
        color:var(--accent, #A88A5A); text-align:center; margin:0 10px 6px; pointer-events:none;
      }
      .site-nav .is-galleries-dropdown a{
        display:block;
        font-family:"Cormorant Garamond","Playfair Display",Georgia,serif !important;
        font-weight:500 !important; font-size:18px; line-height:1.35;
        letter-spacing:0; text-transform:none; text-align:center; color:#3e3e3a; padding:6px 12px;
      }
      .site-nav .is-galleries-dropdown a:hover,
      .site-nav .is-galleries-dropdown a:focus-visible{ color:var(--accent,#A88A5A); }
    }
  </style>

  <style>
    :root{
      --bg:#FAFAF8; --paper:#ffffff; --ink:#3e3e3a; --muted:#6e6a62;
      --line:#e9e6df; --accent:#A88A5A;
      --gap:clamp(16px,3vw,32px); --maxw:1200px;
      --mobile-header-h:64px;

      /* Match about.html desktop header spacing */
      --nav-gap-top:20px;
      --nav-gap-bottom:44px;
    }

    /* ✅ Desktop nav font EXACT match to about.html */
    @media (min-width:821px){
      .topbar nav.primary > ul > li > a{
        font-family:"Raleway","Source Sans 3",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif !important;
        font-weight:500 !important;          /* same light look */
        letter-spacing:.02em;                 /* subtle tracking like about.html */
        text-transform:none;
      }
      .topbar nav.primary > ul > li > a:hover,
      .topbar nav.primary > ul > li > a:focus-visible{
        font-weight:500 !important;           /* don’t thicken on hover */
      }
    }

    /* Use shared nav; spacing only */
    .topbar{ padding-top:var(--nav-gap-top)!important; padding-bottom:var(--nav-gap-bottom)!important; }

    *{box-sizing:border-box}
    html,body{
      margin:0; background:var(--bg); color:var(--ink);
      font-family:"Source Sans 3", system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
      line-height:1.65; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    }
    a{color:inherit; text-decoration:none; transition:color .15s ease, border-color .15s ease}
    a:hover, a:focus-visible{ color:var(--accent); outline:none }
    img{max-width:100%; height:auto; display:block; border:1px solid var(--line); box-shadow:0 6px 18px rgba(0,0,0,.06)}
    .container{max-width:var(--maxw); margin:0 auto; padding:0 var(--gap)}

    /* ===== Page layout ===== */
    main section{padding:calc(var(--gap)*2) 0}

    /* Grid so photos align to the headline top on desktop */
    .contact-grid{
      display:grid; gap:var(--gap);
    }

    /* Headline/lead */
    .contact-header h1{
      font-family:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;
      font-size:clamp(28px,4vw,44px); margin:0 0 10px;
    }
    .contact-header .lead{ color:#67635b; margin:0 0 22px; }

    /* Card + form */
    .card{background:#fff; border:1px solid var(--line); box-shadow:0 10px 30px rgba(0,0,0,.06)}
    .pad{padding:clamp(16px,2.6vw,28px)}

    form{display:grid; gap:14px}
    label{font-weight:600; font-size:14px}
    input, select, textarea{
      width:100%; background:#fff; border:1px solid #ddd; padding:12px; font:inherit; color:inherit; outline:none;
      transition:border-color .15s ease, box-shadow .15s ease;
    }
    input:focus, select:focus, textarea:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(168,138,90,.25) }
    textarea{min-height:140px; resize:vertical}

    .actions{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
    .btn{
      font-family:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;
      display:inline-flex; align-items:center; justify-content:center;
      padding:10px 16px; border:1px solid var(--line); background:#fff; color:#3f3a33;
      font-weight:700; text-decoration:none; border-radius:0; box-shadow:0 6px 18px rgba(0,0,0,.06);
      transition:background-color .15s ease,border-color .15s ease,box-shadow .15s ease,transform .15s ease,color .15s ease;
      cursor:pointer;
    }
    .btn:hover, .btn:focus-visible{
      background:#fff; border-color:#dcd4c3; color:var(--accent);
      box-shadow:0 10px 24px rgba(0,0,0,.08); transform:translateY(-1px);
      outline:none;
    }

    /* Photos column */
    .photos{display:grid; gap:var(--gap)}
    .stack{display:grid; grid-template-columns:1fr 1fr; gap:var(--gap)}

    /* ===== Desktop grid (align with headline) ===== */
    @media (min-width:900px){
      .contact-grid{
        grid-template-columns: 1.25fr .75fr;
        grid-template-areas:
          "header photos"
          "form   photos";
        align-items:start;
      }
      .contact-header{ grid-area: header; }
      .form-wrap     { grid-area: form; }
      .photos        { grid-area: photos; }
      .form-wrap .card{ height:100%; }
    }

    /* ===== Mobile unchanged ===== */
    .mini-gallery{ display:none; }
    @media (max-width:900px){
      main section{
        padding-top: calc(var(--mobile-header-h) + env(safe-area-inset-top, 0px) + 8px);
      }
      .contact-grid{
        grid-template-columns:1fr;
        grid-template-areas:
          "header"
          "form";
      }
      .photos{ display:none; }
      .mini-gallery{
        display:grid;
        grid-template-columns:repeat(3, 1fr);
        gap:8px;
        margin-bottom:8px;
      }
      .mini-gallery img{
        width:100%;
        height:100px;
        object-fit:cover;
        aspect-ratio:4/5;
        border:1px solid var(--line);
        box-shadow:0 3px 10px rgba(0,0,0,.05);
      }
    }
  </style>
</head>
<body>
  <!-- Shared universal navbar -->
  <div data-include="/partials/topnav.html"></div>

  <main id="content">
    <section aria-labelledby="contact-title">
      <div class="container">
        <div class="contact-grid">
          <!-- Headline/lead -->
          <header class="contact-header">
            <h1 id="contact-title">Say Hello</h1>
            <p class="lead">Tell me about your crew and the kind of session you’re envisioning. I reply quickly!</p>
          </header>

          <!-- Form -->
          <div class="form-wrap">
            <div class="card pad">
              <!-- MOBILE mini-collage (hidden on desktop) -->
              <div class="mini-gallery" aria-hidden="true">
                <img src="/pictures/familyPortrait/image5.jpg" alt="">
                <img src="/pictures/thirdTileGal/E26A2022%20(1).jpg" alt="">
                <img src="/pictures/oonaIvy/E26A0761.jpg" alt="">
              </div>

              <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" action="/contact.html?sent=1">
                <input type="hidden" name="form-name" value="contact" />
                <p style="display:none"><label>Don’t fill this out: <input name="bot-field" /></label></p>

                <label for="name">Your Name</label>
                <input id="name" name="name" required placeholder="Jane Doe" autocomplete="name" />

                <label for="email">Email</label>
                <input id="email" name="email" type="email" required placeholder="you@example.com" autocomplete="email" />

                <label for="phone">Phone</label>
                <input id="phone" name="phone" inputmode="tel" placeholder="(xxx) xxx-xxxx" autocomplete="tel" />

                <label for="service">Interested In</label>
                <select id="service" name="service">
                  <option value="Family">Family</option>
                  <option value="Maternity">Maternity</option>
                  <option value="Newborn">Newborn</option>
                  <option value="Portraits">Portraits</option>
                </select>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Tell me a bit about your family and preferred location/time."></textarea>

                <div class="actions">
                  <button class="btn" type="submit">Send</button>
                  <span style="font-size:13px;color:var(--muted)">
                    Or reach me: <a href="mailto:rachelbartonphotography@gmail.com">rachelbartonphotography@gmail.com</a> · <a href="tel:+16153002618">615-300-2618</a>
                  </span>
                </div>
              </form>
            </div>
          </div>

          <!-- Photos (desktop only) -->
          <aside class="photos" aria-hidden="true">
            <img src="/pictures/familyPortrait/image5.jpg" alt="Candid family moment by the water" loading="lazy" sizes="(max-width:900px) 0, 33vw">
            <div class="stack">
              <img src="/pictures/thirdTileGal/E26A2022%20(1).jpg" alt="Golden-hour portrait at the beach" loading="lazy" sizes="(max-width:900px) 0, 16vw">
              <img src="/pictures/oonaIvy/E26A0761.jpg" alt="Siblings in meadow light" loading="lazy" sizes="(max-width:900px) 0, 16vw">
            </div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <!-- Shared footer -->
  <div data-include="/partials/footer.html"></div>

  <!-- include shared nav/footer partials -->
  <script src="/assets/include.js?v=nav-5" defer></script>

  <!-- Wire the Galleries dropdown styling once the nav partial is injected -->
  <script>
    (function () {
      function wire(){
        const links = Array.from(document.querySelectorAll('.site-nav a, .topbar nav a'));
        const galLink = links.find(a => a.textContent.trim() === 'Galleries');
        if(!galLink) return;
        const submenu = galLink.parentElement?.querySelector('.submenu, .dropdown, ul');
        if(!submenu) return;
        submenu.classList.add('is-galleries-dropdown');
        if(!submenu.querySelector('.dropdown-title')){
          const title = document.createElement('div');
          title.className = 'dropdown-title';
          title.textContent = 'Galleries';
          submenu.insertBefore(title, submenu.firstChild);
        }
      }
      if (document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', () => setTimeout(wire, 0));
      } else {
        setTimeout(wire, 0);
      }
    })();
  </script>
</body>
</html>
