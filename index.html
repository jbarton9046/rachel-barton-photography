<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rachel Barton Photography | Sarasota Family & Lifestyle Photographer</title>

  <!-- Primary SEO -->
  <meta name="description" content="Candid, timeless, true-to-life family, maternity, newborn & portrait photography across Sarasota and Florida’s Gulf Coast — with a soft, whimsical touch." />
  <link rel="canonical" href="https://rachelsphotography.netlify.app/" />

  <!-- Fonts (sitewide) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Shared layout -->
  <link rel="stylesheet" href="/assets/layout.css?v=nav-5">

  <!-- Preload hero image -->
  <link rel="preload" as="image" href="pictures/oonaIvy/E26A0671.jpg">

  <style>
    :root{
      --bg:#FAFAF8; --ink:#3e3e3a; --accent:#A88A5A; --line:#e9e6df;
      --ring:rgba(168,138,90,.25); --gap:clamp(16px,3vw,32px); --maxw:1200px;

      /* Positioning knobs (decrease to nudge the card LEFT) */
      --card-max: 1100px;
      --subject-right: 40vw;
      --subject-right-mobile: 24vw;

      /* ✅ Nav spacing to match other pages exactly */
      --nav-gap-top: 20px;
      --nav-gap-bottom: 44px;
    }

    *{ box-sizing:border-box }

    /* Lock the page to one fixed screen; no scrollbars */
    html, body{
      height:100%;
      overflow:hidden;
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:"Source Sans 3",system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
      line-height:1.65;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    a{ color:inherit; text-decoration:none }
    img{ max-width:100%; height:auto; display:block; border:1px solid var(--line); box-shadow:0 6px 18px rgba(0,0,0,.06) }

    /* HERO fills the entire viewport and is fixed behind everything */
    .hero{
      position:fixed;
      inset:0;
      background:url('pictures/oonaIvy/E26A0671.jpg') center 15% / cover no-repeat fixed;
    }

    /* ✅ Navbar: fixed like before, but spacing + font EXACTLY like others */
    .topbar{
      position:fixed; left:0; right:0; top:0; z-index:2; background:transparent;
      padding-top: var(--nav-gap-top) !important;
      padding-bottom: var(--nav-gap-bottom) !important;
    }
    @media (min-width:821px){
      .topbar nav.primary > ul > li > a{
        font-family:"Raleway","Source Sans 3",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif !important;
        font-weight:500 !important;
        letter-spacing:.02em;
        text-transform:none;
      }
      .topbar nav.primary > ul > li > a:hover,
      .topbar nav.primary > ul > li > a:focus-visible{
        font-weight:500 !important; /* no bolding on hover */
      }
    }
    /* Galleries dropdown: serif title + centered items (desktop) */
    @media (min-width:900px){
      .topbar .submenu, .topbar .dropdown{
        background:transparent; border:0; box-shadow:none; padding:6px 0 10px; min-width:170px;
      }
      .topbar .dropdown-title{
        font-family:"Cormorant Garamond","Playfair Display",Georgia,serif;
        font-weight:700; font-size:26px; line-height:1.1;
        color:var(--accent,#A88A5A); text-align:center; margin:0 10px 6px; pointer-events:none;
      }
      .topbar .is-galleries-dropdown a{
        display:block;
        font-family:"Cormorant Garamond","Playfair Display",Georgia,serif !important;
        font-weight:500 !important; font-size:18px; line-height:1.35;
        letter-spacing:0; text-transform:none; text-align:center; color:#3e3e3a; padding:6px 12px;
      }
      .topbar .is-galleries-dropdown a:hover,
      .topbar .is-galleries-dropdown a:focus-visible{ color:var(--accent,#A88A5A); }
    }

    /* Card */
    .hero .copy{
      position:absolute; z-index:1;
      top:50%; left:50%; transform:translate(-50%,-50%);
      display:inline-block;
      max-width:min(94vw, var(--card-max));
      background:rgba(255,255,255,.68);
      border:1px solid var(--line);
      padding:clamp(20px,2.6vw,34px) clamp(24px,3vw,38px);
      text-align:center;
      box-shadow:0 12px 34px rgba(0,0,0,.10);
      backdrop-filter:saturate(1.05) blur(.5px);
    }

    /* Desktop: center between daughter's right edge and viewport right edge */
    @media (min-width:1024px){
      .hero .copy{
        left: calc( (var(--subject-right) + 100vw) / 2 );
        transform: translate(-50%, -50%);
      }
    }

    .eyebrow{
      color:#8d7a5c; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
      font-size:clamp(12px,1.2vw,14px); margin-bottom:12px;
    }
    h1{
      font-family:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;
      font-size:clamp(44px,7.2vw,74px);
      line-height:1.08; margin:.25em 0 .15em; font-weight:700; color:#3f3a33;
    }
    .nowrap{ white-space:nowrap; }

    /* CTA layout (desktop default: row, original order) */
    .cta{
      display:flex; gap:22px; margin:28px 0; flex-wrap:wrap; justify-content:center;
      text-align:center;
    }

    /* Buttons (desktop baseline) */
    .btn{
      --btn-bg: rgba(255,255,255,.14);
      --btn-border: rgba(62,62,58,.28);
      --btn-border-hover: rgba(62,62,58,.45);

      font-family:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;
      display:inline-flex; align-items:center; justify-content:center; gap:8px;

      padding:12px 22px;
      background:var(--btn-bg);
      color:#2f2a24;
      border:1px solid var(--btn-border);
      border-radius:0;
      box-shadow:0 6px 18px rgba(0,0,0,.06);

      font-weight:700; text-decoration:none; text-align:center;
      transition:background-color .18s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease, transform .18s ease;
      white-space:nowrap;
    }
    .btn:hover{
      background:rgba(255,255,255,.20);
      border-color:var(--btn-border-hover);
      color:var(--accent);
      transform:translateY(-1px);
      box-shadow:0 10px 24px rgba(0,0,0,.08);
    }
    .btn:focus-visible{
      outline:0;
      box-shadow:0 0 0 3px var(--ring), 0 10px 24px rgba(0,0,0,.08);
      border-color:var(--btn-border-hover);
    }

    .localities{ color:#5c5850; margin-top:6px; line-height:1.75 }
    .localities .dot::after{ content:" • "; color:#8a857a }
    .localities .dot:last-child::after{ content:"" }

    /* ---------------- MOBILE OPTIMIZATION ---------------- */
    @media (max-width: 820px){
      .hero .copy{
        max-width: 96vw;
        left: calc( (var(--subject-right-mobile) + 100vw) / 2 );
        top: 43.5%;
        transform: translate(-50%, -50%);
        padding: 10px 18px;
      }
      .eyebrow{
        font-size: 11px; letter-spacing: .14em; margin-bottom: 4px;
      }
      h1{
        font-size: clamp(34px, 7.8vw, 44px);
        line-height: 1.04;
        margin: .05em 0 .05em;
      }

      /* ✅ Mobile-only: stack in a centered column with Say Hello first */
      .cta{
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:10px;
        margin: 12px 0 6px;
      }
      .btn--say { order:-1; } /* move Say Hello to the top on mobile */

      /* ✅ Mobile buttons: same style as desktop, but tighter padding
         so the outline hugs the text tastefully */
      .btn{
        padding:8px 14px;         /* tighter than desktop */
        font-size:16px;
        background:var(--btn-bg);
        border:1px solid var(--btn-border);
        box-shadow:0 4px 14px rgba(0,0,0,.06);
        border-radius:0;
        font-weight: 500;
        min-width:auto;
      }
      .btn:hover{
        background:rgba(255,255,255,.20);
        border-color:var(--btn-border-hover);
        color:var(--accent);
        transform:translateY(-1px);
      }
      .btn:focus-visible{
        outline:0;
        box-shadow:0 0 0 3px var(--ring);
      }

      .localities{
        font-size: 12.25px;
        line-height: 1.35;
        margin-top: 4px;
        opacity: .95;
      }
      .localities br{ display:none; }
      .localities .dot{ margin-right: .15ch; }
      .localities .dot::after{ content:" • "; color:#8a857a; }
    }

    @media (max-width: 380px){
      .hero .copy{ padding: 9px 16px; top: 43.5%; }
      h1{ font-size: clamp(28px, 8.4vw, 36px); }
      .btn{ font-size: 15px; padding: 7px 12px; } /* keep the tight feel on very small screens */
      .localities{ font-size: 11.8px; line-height: 1.32; }
    }

    /* Hide anything below; we’re a fixed, one-screen hero */
    .scallop, main, footer { display:none !important; }
  </style>
</head>
<body>

  <!-- Shared Top Nav lives OUTSIDE the hero so the drawer stays fixed left -->
  <div data-include="/partials/topnav.html"></div>

  <!-- HERO -->
  <section id="content" class="hero" aria-label="Hero">
    <div class="copy">
      <div class="eyebrow">Welcome to</div>
      <h1><span class="nowrap">Rachel Barton</span><br>Photography</h1>

      <div class="cta">
        <!-- Desktop keeps original order; mobile reorders via CSS -->
        <a class="btn btn--book" href="/book.html" aria-label="Book a Session">Book a Session</a>
        <a class="btn btn--say" href="/contact.html" aria-label="Say Hello">Say Hello</a>
      </div>

      <div class="localities">
        <span class="dot">Sarasota</span><span class="dot">Siesta Key</span><span class="dot">Lido</span><span class="dot">Longboat Key</span><br>
        <span class="dot">Lakewood Ranch</span><span class="dot">Venice</span><span class="dot">Bradenton</span><br>
        <span class="dot">Tampa</span><span class="dot">St. Petersburg</span><span class="dot">Clearwater</span><span>Naples</span>
      </div>
    </div>
  </section>

  <!-- Partials loader -->
  <script src="/assets/include.js?v=nav-5" defer></script>

  <!-- Wire the Galleries dropdown styling after the nav partial injects -->
  <script>
    (function () {
      function wire(){
        const links = Array.from(document.querySelectorAll('.site-nav a, .topbar nav a'));
        const galLink = links.find(a => a.textContent.trim() === 'Galleries');
        if(!galLink) return;
        const submenu = galLink.parentElement?.querySelector('.submenu, .dropdown, ul');
        if(!submenu) return;
        submenu.classList.add('is-galleries-dropdown');
        if(!submenu.querySelector('.dropdown-title')){
          const title = document.createElement('div');
          title.className = 'dropdown-title';
          title.textContent = 'Galleries';
          submenu.insertBefore(title, submenu.firstChild);
        }
      }
      if (document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', () => setTimeout(wire, 0));
      } else {
        setTimeout(wire, 0);
      }
    })();
  </script>
</body>
</html>
