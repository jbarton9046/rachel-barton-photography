<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book a Session | Rachel Barton Photography</title>
  <meta name="description" content="Book a family, maternity, newborn, or portrait session in Sarasota and Florida’s Gulf Coast." />

  <!-- Fonts (match about.html: add Raleway for desktop nav) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Shared layout (universal navbar + footer) -->
  <link rel="stylesheet" href="/assets/layout.css?v=nav-5">

  <style>
    :root{
      --bg:#FAFAF8; --paper:#ffffff; --ink:#3e3e3a; --muted:#6e6a62;
      --line:#e9e6df; --accent:#A88A5A;
      --gap:clamp(16px,3vw,32px); --maxw:960px;

      /* Header spacing (site standard) */
      --nav-gap-top:20px;
      --nav-gap-bottom:44px;

      /* Sticky header height for phones (used to clear overlap) */
      --mobile-header-h:64px;
    }

    /* ✅ Make the NAV BAR run wider (1200px) without widening page content.
       These selectors match the inner container used by the /partials/topnav.html include. */
    .topbar,
    .topbar .container,
    .topbar .inner{
      /* keep the visual padding but let the inner track breathe */
      max-width:1200px !important;
      margin-left:auto; margin-right:auto;
      width:100%;
    }

    /* Desktop nav font EXACT match to about.html */
    @media (min-width:821px){
      .topbar nav.primary > ul > li > a{
        font-family:"Raleway","Source Sans 3",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif !important;
        font-weight:500 !important;
        letter-spacing:.02em;
        text-transform:none;
      }
      .topbar nav.primary > ul > li > a:hover,
      .topbar nav.primary > ul > li > a:focus-visible{
        font-weight:500 !important;
      }
    }

    /* Normalize topbar spacing only (other styles live in layout.css) */
    .topbar{
      padding-top:var(--nav-gap-top) !important;
      padding-bottom:var(--nav-gap-bottom) !important;
    }

    *{box-sizing:border-box}
    html,body{
      margin:0; background:var(--bg); color:var(--ink);
      font-family:"Source Sans 3",system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
      line-height:1.65; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    }
    a{color:inherit; text-decoration:none; transition:color .15s ease, border-color .15s ease}
    a:hover, a:focus-visible{ color:var(--accent); outline:none }

    /* Keep page content at 960px while the nav uses 1200px */
    .container{max-width:var(--maxw); margin:0 auto; padding:0 var(--gap)}

    main section{padding:calc(var(--gap)*2) 0}
    h1{
      font-family:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;
      font-size:clamp(28px,4vw,44px);
      margin:0 0 10px;
    }
    .lead{color:#67635b; margin:0 0 20px}

    /* Buttons (match site look) */
    .btn{
      font-family:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;
      display:inline-flex; align-items:center; justify-content:center;
      padding:10px 16px; border:1px solid var(--line); background:#fff; color:#3f3a33;
      font-weight:700; border-radius:0; box-shadow:0 6px 18px rgba(0,0,0,.06);
      transition:background-color .15s ease,border-color .15s ease,box-shadow .15s ease,transform .15s ease,color .15s ease;
      white-space:nowrap;
    }
    .btn:hover,.btn:focus-visible{
      background:#fff; border-color:#dcd4c3; color:var(--accent);
      box-shadow:0 10px 24px rgba(0,0,0,.08); transform:translateY(-1px)
    }
    .btn-ghost{ background:#fff; }

    /* Top action bar (houses the Golden Hour button) */
    .actions{
      display:flex; justify-content:flex-end; align-items:center;
      gap:12px; margin:10px 0 18px;
    }

    .card{
      background:#fff; border:1px solid var(--line);
      box-shadow:0 10px 30px rgba(0,0,0,.06);
      padding:clamp(16px,2.6vw,28px);
    }

    /* Scheduling embed */
    .iframe-wrap{position:relative}
    .iframe-wrap iframe{
      display:block; width:100%; height:820px; border:0; background:#fff;
    }

    /* -------- Mobile polish -------- */
    @media (max-width:900px){
      main section{ padding-top: calc(var(--mobile-header-h) + env(safe-area-inset-top, 0px) + 8px); }
      .actions{ justify-content:flex-start; }
    }
    @media (max-width:640px){
      h1{ font-size:clamp(26px,6vw,36px); }
      .lead{ margin-bottom:14px; }
      .card{ padding:16px; box-shadow:0 8px 22px rgba(0,0,0,.05); }
      .iframe-wrap iframe{
        height: min(1100px, calc(100svh - (var(--mobile-header-h) + 120px)));
      }
    }
  </style>
</head>
<body>
  <!-- Universal navbar -->
  <div data-include="/partials/topnav.html"></div>

  <main id="content">
    <section>
      <div class="container">
        <h1>Book a Session</h1>
        <p class="lead">Pick a date that works for you. Don’t see your ideal time? <a href="/contact.html">Send a note</a> and I’ll try to accommodate.</p>

        <!-- Professional inline action: link to the Golden Hour planner -->
        <div class="actions">
          <a class="btn btn-ghost" href="/light-planner.html" aria-label="Plan by light with Golden Hour times">Plan by light — Golden Hour</a>
        </div>

        <div class="card">
          <div class="iframe-wrap">
            <iframe
              src="https://app.acuityscheduling.com/schedule.php?owner=37092379&embedded=1"
              title="Book a Session with Rachel Barton Photography"
              allow="payment *"
              loading="eager">
            </iframe>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Shared footer -->
  <div data-include="/partials/footer.html"></div>

  <!-- includes -->
  <script src="/assets/include.js?v=nav-5" defer></script>
  <script src="https://embed.acuityscheduling.com/js/embed.js" async></script>
</body>
</html>
