<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book a Session | Rachel Barton Photography</title>
  <meta name="description" content="Book a family, maternity, newborn, or portrait session in Sarasota and Florida’s Gulf Coast." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Shared layout (universal navbar + footer) -->
  <link rel="stylesheet" href="/assets/layout.css?v=nav-5">

  <style>
    :root{
      --bg:#FAFAF8; --paper:#ffffff; --ink:#3e3e3a; --muted:#6e6a62;
      --line:#e9e6df; --accent:#A88A5A;
      --gap:clamp(16px,3vw,32px); --maxw:960px;

      /* Keep consistent with other pages */
      --nav-gap-top:16px;
      --nav-gap-bottom:40px;

      /* Sticky header height for phones (used to clear overlap) */
      --mobile-header-h:64px;
    }

    /* Normalize topbar spacing only (styles live in layout.css) */
    .topbar{
      padding-top:var(--nav-gap-top) !important;
      padding-bottom:var(--nav-gap-bottom) !important;
    }

    *{box-sizing:border-box}
    html,body{
      margin:0; background:var(--bg); color:var(--ink);
      font-family:"Source Sans 3",system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
      line-height:1.65; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    }
    a{color:inherit; text-decoration:none; transition:color .15s ease, border-color .15s ease}
    a:hover, a:focus-visible{ color:var(--accent); outline:none }

    .container{max-width:var(--maxw); margin:0 auto; padding:0 var(--gap)}

    main section{padding:calc(var(--gap)*2) 0}
    h1{
      font-family:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;
      font-size:clamp(28px,4vw,44px);
      margin:0 0 10px;
    }
    .lead{color:#67635b; margin:0 0 20px}

    .card{
      background:#fff; border:1px solid var(--line);
      box-shadow:0 10px 30px rgba(0,0,0,.06);
      padding:clamp(16px,2.6vw,28px);
    }

    /* Scheduling embed */
    .iframe-wrap{position:relative}
    .iframe-wrap iframe{
      display:block; width:100%; height:820px; border:0; background:#fff;
    }

    /* -------- Mobile polish -------- */
    @media (max-width:900px){
      /* Ensure content starts below sticky header + iOS safe area */
      main section{
        padding-top: calc(var(--mobile-header-h) + env(safe-area-inset-top, 0px) + 8px);
      }
    }
    @media (max-width:640px){
      h1{ font-size:clamp(26px,6vw,36px); }
      .lead{ margin-bottom:14px; }
      .card{ padding:16px; box-shadow:0 8px 22px rgba(0,0,0,.05); }

      /* Let the scheduler use available viewport height on phones,
         but cap so the footer isn't pushed to infinity on very tall screens. */
      .iframe-wrap iframe{
        height: min(1100px, calc(100svh - (var(--mobile-header-h) + 120px)));
      }
    }
  </style>
</head>
<body>
  <!-- Universal navbar -->
  <div data-include="/partials/topnav.html"></div>

  <main id="content">
    <section>
      <div class="container">
        <h1>Book a Session</h1>
        <p class="lead">Pick a date that works for you. Don’t see your ideal time? <a href="/contact.html">Send a note</a> and I’ll try to accommodate.</p>

        <div class="card">
          <div class="iframe-wrap">
            <iframe
              src="https://app.acuityscheduling.com/schedule.php?owner=37092379&embedded=1"
              title="Book a Session with Rachel Barton Photography"
              allow="payment *"
              loading="eager">
            </iframe>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Shared footer -->
  <div data-include="/partials/footer.html"></div>

  <!-- includes -->
  <script src="/assets/include.js?v=nav-5" defer></script>
  <script src="https://embed.acuityscheduling.com/js/embed.js" async></script>
</body>
</html>
