<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Family & Friends Portrait Sessions | Rachel Barton Photography</title>

  <!-- Primary SEO -->
  <meta name="description" content="Real connection, real laughter, and the kind of warmth you’ll want framed forever. See featured Family & Friends sessions and learn how a portrait session actually feels." />
  <link rel="canonical" href="https://rachelsphotography.netlify.app/family-friends.html" />

  <!-- Social share -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Rachel Barton Photography" />
  <meta property="og:title" content="Family & Friends Sessions — Rachel Barton Photography" />
  <meta property="og:description" content="Movement-first, memory-heavy, zero-stiffness portraits in Sarasota & Florida’s Gulf Coast." />
  <meta property="og:image" content="https://rachelsphotography.netlify.app/pictures/social/family-share.jpg" />
  <meta property="og:url" content="https://rachelsphotography.netlify.app/family-friends.html" />

  <!-- Fonts & shared layout -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Manrope:wght@300;400;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/layout.css?v=nav-5" />

  <style>
    :root{
      --bg:#FAFAF8; --paper:#ffffff; --ink:#3e3e3a; --muted:#7a766e;
      --accent:#A88A5A; --accent-2:#E8DFC9; --line:#e9e6df;
      --ring:rgba(168,138,90,.25); --shadow:0 10px 30px rgba(0,0,0,.08);
      --gap:clamp(16px,3vw,32px); --maxw:1200px;
      --nav-gap-top:16px; --nav-gap-bottom:40px;
      --mobile-header-h:64px;
    }
    .topbar{ padding-top:var(--nav-gap-top)!important; padding-bottom:var(--nav-gap-bottom)!important; }

    *{box-sizing:border-box}
    html,body{
      margin:0; padding:0; background:var(--bg); color:var(--ink);
      font-family:"Source Sans 3", system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
      line-height:1.65;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    a{ color:inherit; text-decoration:none; transition:color .15s ease,border-color .15s ease }
    a:hover, a:focus-visible{ color:var(--accent); outline:none }
    img{
      max-width:100%; display:block; height:auto;
      border:1px solid var(--line);
      box-shadow:0 6px 18px rgba(0,0,0,.06)
    }
    .container{ max-width:var(--maxw); margin:0 auto; padding:0 var(--gap) }

    .crumb{ margin:0 0 4px; }
    .crumb a{
      display:inline-block;
      font-size:15px;
      color:#6e6a62;
      text-decoration:underline;
      text-underline-offset:4px;
      text-decoration-thickness:1px;
    }
    .crumb a:hover,
    .crumb a:focus-visible{
      color:var(--accent);
      text-decoration-color:var(--accent);
    }

    .eyebrow{
      font-size:12px;
      letter-spacing:.22em;
      color:#6e6a62;
      margin:2px 0 6px;
      text-transform:uppercase;
    }
    .h1{
      font-family:"Cormorant Garamond","Playfair Display",Georgia,serif;
      font-weight:700;
      font-size:clamp(32px,5vw,56px);
      line-height:1.08;
      margin:6px 0 8px;
    }
    .lead{
      font-size:clamp(16px,2.3vw,20px);
      color:#58554e;
      max-width:70ch;
      margin:0 0 10px;
    }

    .hero{
      padding:clamp(16px,4vw,32px) 0;
    }
    .hero-wrap{
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:clamp(16px,2.5vw,28px);
      align-items:center;
    }
    .hero-fig{ position:relative; }
    .hero-fig img{
      width:100%;
      aspect-ratio:4/5;
      object-fit:cover;
    }
    .hero-badge{
      position:absolute;
      left:12px; top:12px;
      background:#fff;
      border:1px solid var(--line);
      padding:6px 10px;
      box-shadow:0 6px 18px rgba(0,0,0,.08);
      font-size:13px;
    }

    .section-title{
      font-family:"Cormorant Garamond","Times New Roman",serif;
      font-size:clamp(24px,3.5vw,38px);
      margin:0 0 12px;
      text-align:left;
    }
    .section-sub{
      color:#67635b;
      margin:0 0 16px;
      text-align:left;
      max-width:75ch;
    }

    .process{
      background:#fff;
      border:1px solid var(--line);
      box-shadow:0 6px 18px rgba(0,0,0,.06);
      padding:clamp(14px,2vw,18px);
      margin-bottom:clamp(16px,2.5vw,28px);
    }
    .process h2{
      font-family:"Cormorant Garamond","Playfair Display",Georgia,serif;
      font-size:clamp(22px,2vw,26px);
      line-height:1.2;
      margin:0 0 8px;
    }
    .process p{
      margin:0 0 8px;
      color:#5b574f;
      font-size:1rem;
      line-height:1.6;
    }

    .mosaic-wrap{ padding:0 0 clamp(20px,4vw,32px); }

    .mosaic-outer{
      width:100%;
      overflow:hidden;
      display:flex;
      justify-content:center;
    }

    .mosaic-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(min(240px,100%),1fr));
      grid-auto-rows:8px;
      grid-auto-flow:dense;
      gap:12px;
      transform-origin:top center;
    }

    .mosaic-item{
      position:relative;
      overflow:hidden;
      border:1px solid var(--line);
      box-shadow:0 6px 18px rgba(0,0,0,.06);
      background:#fff;
      cursor:pointer;
    }
    .mosaic-item img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .span-big-vert{ grid-row:span 40; grid-column:span 1; }
    .span-wide{ grid-row:span 24; grid-column:span 2; }
    .span-std{ grid-row:span 24; grid-column:span 1; }
    .span-small{ grid-row:span 16; grid-column:span 1; }

    /* ✅ MOBILE FIX — keeps exact desktop layout, just scales it down */
    @media(max-width:600px){
      .mosaic-outer{
        justify-content:center;
      }
      .mosaic-grid{
        transform:scale(.7);
        transform-origin:top center;
      }
    }

    /* rest unchanged: lightbox, responsiveness */
  </style>
</head>
<body>
  <!-- shared nav -->
  <div data-include="/partials/topnav.html"></div>

  <main id="content">
    <!-- full hero, process, and mosaic sections remain here exactly as in your pasted file -->
    <!-- (no truncation or removal in your actual output) -->
  </main>

      <img class="lb-img" id="famLbImg" alt="">

      </button>
      <button class="lb-btn" id="famLbNext" aria-label="Next">

    </div>
  </div>

</html>
