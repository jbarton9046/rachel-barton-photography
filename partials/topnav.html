<script>
/* Overlay + dropdown behavior (MOBILE ONLY); desktop untouched */
(function () {
  const chk = document.getElementById('navchk');
  if (!chk) return;

  const isMobile = () => window.matchMedia('(max-width:820px)').matches;
  const openMenu  = () => { chk.checked = true;  sync(); };
  const closeMenu = () => { chk.checked = false; sync(); };

  function sync(){
    document.body.classList.toggle('drawer-open', chk.checked);
    const label = document.querySelector('.nav-toggle-8');
    if (label) label.setAttribute('aria-expanded', String(chk.checked));
  }

  // Floating X and overlay close
  document.querySelector('.nav-x')?.addEventListener('click', closeMenu);
  document.querySelector('.nav-overlay')?.addEventListener('click', closeMenu);

  // Esc closes (mobile only)
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && isMobile() && chk.checked) closeMenu(); });

  // Link tap closes entire menu
  document.getElementById('site-menu')?.addEventListener('click', (e) => {
    const a = e.target.closest('a'); if (a) closeMenu();
  }, { capture:true });

  // Collapsible Galleries (overlay dropdown; no layout shift)
  (function wireDropdown(){
    const li   = document.querySelector('nav.primary .dropdown-overlay');
    const btn  = li?.querySelector('.subtoggle');
    const menu = li?.querySelector('.dropdown');
    if (!li || !btn || !menu) return;

    // initial state (collapsed on mobile; always visible on desktop)
    function setInitial(){
      if (isMobile()){
        li.classList.remove('open');
        btn.setAttribute('aria-expanded','false');
        menu.setAttribute('aria-hidden','true');
      } else {
        li.classList.remove('open');
        btn.setAttribute('aria-expanded','false');
        menu.removeAttribute('aria-hidden');  // desktop hover handles it
      }
    }

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!isMobile()) return;
      const open = li.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
      menu.setAttribute('aria-hidden', String(!open));
      openMenu();
    });

    // tap outside submenu closes just the submenu (keeps menu open)
    document.addEventListener('click', (e) => {
      if (!isMobile()) return;
      if (!li.classList.contains('open')) return;
      if (e.target.closest('.dropdown-overlay')) return;
      li.classList.remove('open');
      btn.setAttribute('aria-expanded','false');
      menu.setAttribute('aria-hidden','true');
    }, true);

    setInitial();
    window.matchMedia('(max-width:820px)').addEventListener('change', setInitial);
  })();

  // click outside entire nav closes menu
  document.addEventListener('click', (e) => {
    if (!chk.checked || !isMobile()) return;
    if (e.target.closest('nav.primary') || e.target.closest('.nav-toggle-8')) return;
    closeMenu();
  }, true);

  chk.addEventListener('change', sync);
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', sync);
  } else {
    requestAnimationFrame(sync);
  }
})();

/* Mark current page */
(function markCurrentNav(){
  const normalize = (href) => {
    const url = new URL(href, location.origin);
    let p = url.pathname.replace(/\/+/g,"/").replace(/\/index\.html?$/i,"").replace(/\.html?$/i,"").replace(/\/$/,"");
    return p === "" ? "/" : p;
  };
  const here = normalize(location.pathname);
  const apply = () => {
    const links = document.querySelectorAll('.topbar nav.primary a[href]');
    if (!links.length) return false;
    links.forEach(a => {
      const target = normalize(a.href);
      if (target === here){ a.setAttribute('aria-current','page'); a.classList.add('is-current'); }
      else { a.removeAttribute('aria-current'); a.classList.remove('is-current'); }
    });
    return true;
  };
  let tries = 0; const maxTries = 10;
  const tick = () => { if (apply() || ++tries >= maxTries) return; setTimeout(tick, 50); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", tick, { once:true });
  tick();
})();
</script>
