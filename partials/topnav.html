<!-- /partials/topnav.html -->
<div class="topbar container mobile-header-8">
  <!-- drawer checkbox (mobile) -->
  <input id="navchk" class="navchk" type="checkbox" aria-hidden="true" />

  <!-- MOBILE overlay backdrop (click to close; desktop hidden) -->
  <div class="nav-overlay mobile-only" aria-hidden="true"></div>
  <!-- MOBILE floating X (no circle, no layout impact) -->
  <button class="nav-x mobile-only" type="button" aria-label="Close menu">×</button>

  <!-- Left cluster: original hamburger + brand (mobile only) -->
  <div class="left-cluster mobile-only">
    <label for="navchk"
           class="nav-toggle-8"
           aria-label="Open menu"
           role="button"
           aria-controls="primary-nav"
           aria-expanded="false">
      <span class="bar b-top"></span>
      <span class="bar b-mid"></span>
      <span class="bar b-bot"></span>
    </label>

    <a href="/" class="brand-name" aria-label="Rachel Barton Photography — Home">
      <span class="brand-line1">Rachel</span>
      <span class="brand-line2">Barton</span>
      <span class="brand-sub">Photography</span>
    </a>
  </div>

  <!-- Desktop brand (kept hidden to avoid the rogue logo) -->
  <a class="brand desktop-only" href="/" aria-label="Home">
    <span class="brand-line1">Rachel</span>
    <span class="brand-line2">Barton</span>
    <span class="brand-sub">Photography</span>
  </a>

  <!-- PRIMARY NAV -->
  <nav id="primary-nav" class="primary center-mobile" aria-label="Primary">
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/about.html">Meet Rachel</a></li>

      <!-- Galleries: label + caret locked on row 1; submenu spans row 2 (centered) -->
      <li class="has-sub is-collapsible dropdown-overlay nav-center">
        <a href="/galleries.html" aria-haspopup="true">Galleries</a>
        <button class="subtoggle mobile-only"
                type="button"
                aria-label="Toggle Galleries submenu"
                aria-controls="galleries-submenu"
                aria-expanded="false">▾</button>

        <ul class="dropdown" id="galleries-submenu" aria-label="Galleries submenu" hidden aria-hidden="true">
          <li><a href="/portraits.html">Portraits</a></li>
          <li><a href="/branding.html">Branding</a></li>
          <li><a href="/events.html">Events</a></li>
        </ul>
      </li>

      <li><a href="/testimonials.html">Testimonials</a></li>
      <li><a href="/faq.html">FAQ</a></li>
      <li><a href="/light-planner.html">Golden Hour</a></li>
      <li><a href="/contact.html">Contact</a></li>
      <li><a href="/book.html">Book</a></li>
    </ul>
  </nav>
</div>

<style>
/* desktop shows your regular header; hide the mobile cluster */
@media (min-width:821px){ .mobile-only{ display:none !important; } }
/* HIDE the rogue desktop brand completely */
@media (min-width:821px){ .topbar .brand.desktop-only{ display:none !important; } }

@media (max-width:820px){ .desktop-only{ display:none !important; } }

/* base header wrapper */
.mobile-header-8{
  position:relative; display:flex; align-items:center; justify-content:center;
  padding:16px var(--gap);
}

/* =========================== MOBILE ONLY =========================== */
@media (max-width:820px){
  .mobile-header-8{
    position:fixed; top:8px; left:0; right:0; z-index:2200;
    padding:0 10px; background:transparent; justify-content:flex-start;
  }
  .mobile-header-8 .left-cluster{ display:flex; align-items:center; gap:12px; }

  /* hamburger */
  .nav-toggle-8{
    position:relative; width:44px; height:26px; border:0;
    background:transparent !important; box-shadow:none !important; cursor:pointer; color:#2f2a24;
    z-index:2400; pointer-events:auto;
  }
  .nav-toggle-8 .bar{
    position:absolute; left:0; height:2px; border-radius:999px; background:currentColor; opacity:.96;
    box-shadow:0 .5px 0 rgba(255,255,255,.45), 0 6px 12px rgba(0,0,0,.18);
  }
  .nav-toggle-8 .b-bot{ width:28px; bottom:2px; left:0; }
  .nav-toggle-8 .b-mid{ width:20px; top:50%; transform:translate(-50%, -50%); left:50%; }
  .nav-toggle-8 .b-top{ width:14px; top:2px; left:50%; }

  .brand-name{
    display:inline-flex; flex-direction:column; justify-content:center;
    text-decoration:none; line-height:1.02; color:#2f2a24;
    text-shadow:0 1px 0 rgba(255,255,255,.45), 0 8px 18px rgba(0,0,0,.04);
  }
  .brand-name .brand-line1{ font-family:"Fraunces", serif; font-weight:700; font-size:16px; letter-spacing:.2px; }
  .brand-name .brand-line2{ font-family:"Fraunces", serif; font-weight:700; font-size:16px; margin-top:-2px; }
  .brand-name .brand-sub{ font-family:"Raleway", sans-serif; font-weight:500; font-size:11px; opacity:.9; margin-top:1px; }

  /* overlay menu = the nav itself */
  nav.primary{
    position:fixed; inset:0;
    width:100vw; height:100dvh;
    background:var(--drawer-bg);
    transform:translateY(-4%); opacity:0; pointer-events:none;
    transition:opacity .28s ease, transform .28s ease;
    z-index:2000; overflow:auto;
  }
  #navchk:checked ~ nav.primary{ opacity:1; pointer-events:auto; transform:translateY(0); }

  /* backdrop & close X */
  .nav-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.25);
    opacity:0; pointer-events:none; transition:opacity .28s ease; z-index:1990;
  }
  #navchk:checked ~ .nav-overlay{ opacity:1; pointer-events:auto; }
  .nav-x{
    position:fixed; top:10px; right:12px; z-index:2300;
    padding:8px 10px; background:transparent; border:0;
    color:#3f3a33; font-size:26px; line-height:1; cursor:pointer;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  #navchk:checked ~ .nav-x{ opacity:1; pointer-events:auto; }

  /* stack & center */
  nav.primary.center-mobile ul{
    display:flex; flex-direction:column; align-items:center;
    gap:12px; margin:0; padding:32px 16px 28px; list-style:none; row-gap:6px; text-align:center; width:100%;
  }
  nav.primary li{ width:min(520px, 92vw); }
  nav.primary > ul > li > a{
    display:block; width:100%;
    font-family:"Raleway", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    font-weight:500; font-size:20px; line-height:1.35;
    padding:12px 16px; border-radius:10px;
  }
  nav.primary > ul > li + li{ position:relative }
  nav.primary > ul > li + li::before{
    content:""; position:absolute; left:10%; right:10%; top:-3px; height:1px;
    background:linear-gradient(to right, transparent, var(--drawer-rule, rgba(0,0,0,.06)), transparent); opacity:.6;
  }
  nav.primary a:hover{ color:var(--accent); }
  nav.primary a.is-current,
  nav.primary a[aria-current="page"]{ color:var(--accent); text-decoration:none !important; }

  /* ======== GRID LOCK: keep Galleries row stationary & centered ======== */
  /* Make the Galleries <li> a 2-col grid: [label][caret] on row 1; submenu on row 2 */
  nav.primary .has-sub.nav-center{
    width:auto !important;
    margin:0 auto;
    display:grid;                         /* <— grid prevents reflow shift */
    grid-template-columns:max-content max-content;
    grid-auto-rows:auto;
    column-gap:6px;
    justify-content:center;               /* centers row 1 */
    align-items:center;
    text-align:center;
  }
  /* label in col 1 */
  nav.primary .has-sub.nav-center > a{
    grid-column:1; grid-row:1;
    display:inline-block;
    width:auto !important;                /* override the 100% width rule */
    padding:12px 10px;
    justify-content:center; align-items:center;
  }
  /* caret in col 2 */
  nav.primary .has-sub.nav-center > .subtoggle{
    grid-column:2; grid-row:1;
    appearance:none; border:0; background:transparent;
    padding:0 4px; margin-left:2px;
    border-radius:8px; line-height:1; font-size:22px;
    cursor:pointer;
  }
  /* submenu spans both columns underneath; centered pills */
  nav.primary .has-sub.nav-center > .dropdown{
    grid-column:1 / -1; grid-row:2;
    position:static; transform:none; width:100%;
    margin:6px 0 12px 0; padding:0; text-align:center;
    background:transparent; border:0; box-shadow:none; list-style:none;
  }
  nav.primary .has-sub.nav-center > .dropdown[hidden]{ display:none !important; }
  nav.primary .has-sub.nav-center > .dropdown li{ list-style:none; display:block; }
  nav.primary .has-sub.nav-center > .dropdown a{
    display:inline-block;                 /* NOT full-width */
    font-family:"Raleway", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    font-weight:500; font-size:20px; line-height:1.35;
    padding:12px 10px; border-radius:10px; background:transparent;
    text-align:center;
  }
  nav.primary .has-sub.nav-center > .dropdown a::before{ content:none; }
  nav.primary .has-sub.nav-center > .dropdown a:hover,
  nav.primary .has-sub.nav-center > .dropdown a:focus-visible{
    color:var(--accent);
    background:var(--drawer-hover);
  }
}
/* ==================================================================== */
</style>

<script>
/* Mobile-only behavior; desktop untouched */
(function () {
  const chk = document.getElementById('navchk');
  const isMobile = () => window.matchMedia('(max-width:820px)').matches;

  function sync(){
    const open = !!(chk && chk.checked);
    document.body.classList.toggle('drawer-open', open);
    const label = document.querySelector('.nav-toggle-8');
    if (label) label.setAttribute('aria-expanded', String(open));

    /* When closing, also collapse the Galleries submenu so it reopens centered cleanly */
    if (!open) {
      const li = document.querySelector('nav.primary .is-collapsible');
      const btn = li && li.querySelector('.subtoggle');
      const dd  = li && li.querySelector('.dropdown');
      if (btn && dd){
        btn.setAttribute('aria-expanded','false');
        dd.hidden = true; dd.setAttribute('aria-hidden','true');
      }
    }
  }
  function closeMenu(){ if (chk){ chk.checked = false; sync(); } }

  /* Explicit toggle to avoid label misfires on iOS */
  (function wireHamburger(){
    const ham = document.querySelector('.nav-toggle-8');
    if (!ham || ham.dataset.wired) return;
    ham.addEventListener('click', (e)=>{
      if (!isMobile()) return;
      if (!chk) return;
      chk.checked = !chk.checked;
      sync();
      e.preventDefault();
      e.stopPropagation();
    });
    ham.dataset.wired = '1';
  })();

  /* Caret toggle (submenu inline, centered) */
  (function wireSubtoggle(){
    if (!isMobile()) return;
    const li  = document.querySelector('nav.primary .is-collapsible');
    const btn = li && li.querySelector('.subtoggle');
    const dd  = li && li.querySelector('.dropdown');
    if (!li || !btn || !dd) return;

    btn.setAttribute('aria-expanded','false');
    dd.hidden = true; dd.setAttribute('aria-hidden','true');

    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const next = btn.getAttribute('aria-expanded') !== 'true';
      btn.setAttribute('aria-expanded', String(next));
      dd.hidden = !next; dd.setAttribute('aria-hidden', String(!next));
    }, { passive:false });
  })();

  /* Close mechanics */
  (function wireClose(){
    const overlay = document.querySelector('.nav-overlay');
    if (overlay) overlay.addEventListener('click', closeMenu, { passive:true });

    const closeX = document.querySelector('.nav-x');
    if (closeX) closeX.addEventListener('click', closeMenu);

    document.addEventListener('keydown', (e)=>{
      if (e.key === 'Escape' && isMobile() && chk?.checked) closeMenu();
    });

    const nav = document.querySelector('nav.primary');
    if (nav){
      nav.addEventListener('click', (e)=>{
        const a = e.target.closest('a');
        if (a) closeMenu();
      }, { capture:true });
    }
  })();

  function setInitial(){ if (isMobile()) sync(); }
  setInitial();
  window.matchMedia('(max-width:820px)').addEventListener('change', setInitial);

  document.addEventListener('click', (e)=>{
    if (!chk?.checked || !isMobile()) return;
    if (e.target.closest('nav.primary') || e.target.closest('.nav-toggle-8')) return;
    closeMenu();
  }, true);

  chk?.addEventListener('change', sync);

  /* mark current page quickly */
  (function markCurrent(){
    const normalize = (href) => {
      const url = new URL(href, location.origin);
      let p = url.pathname.replace(/\/+/g,"/").replace(/\/index\.html?$/i,"").replace(/\.html?$/i,"").replace(/\/$/,"");
      return p === "" ? "/" : p;
    };
    const here = normalize(location.pathname);
    const links = document.querySelectorAll('.topbar nav.primary a[href]');
    links.forEach(a => {
      const target = normalize(a.href);
      if (target === here){ a.setAttribute('aria-current','page'); a.classList.add('is-current'); }
      else { a.removeAttribute('aria-current'); a.classList.remove('is-current'); }
    });
  })();
})();
</script>
