<script>
/* Overlay/drawer logic + close behaviors (mobile only); desktop untouched */
(function () {
  const chk = document.getElementById('navchk');
  if (!chk) return;

  const isMobile = () => window.matchMedia('(max-width:820px)').matches;

  function sync() {
    document.body.classList.toggle('drawer-open', chk.checked);
    const label = document.querySelector('.nav-toggle-8');
    if (label) label.setAttribute('aria-expanded', String(chk.checked));
  }

  // Close helpers
  function closeMenu(){ chk.checked = false; sync(); }
  function openMenu(){ chk.checked = true; sync(); }

  // Close on overlay tap
  const overlay = document.querySelector('.nav-overlay');
  if (overlay) overlay.addEventListener('click', closeMenu);

  // Close button inside menu
  const closeBtn = document.querySelector('nav.primary .nav-close');
  if (closeBtn) closeBtn.addEventListener('click', closeMenu);

  // Close on Esc (mobile only)
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && isMobile() && chk.checked) closeMenu();
  });

  // Close when a nav link is tapped
  const nav = document.getElementById('site-menu');
  if (nav) {
    nav.addEventListener('click', (e) => {
      const a = e.target.closest('a');
      if (a) closeMenu();
    }, { capture:true });
  }

  // Collapsible Galleries (mobile only): separate subtoggle, keeps main link intact
  (function wireCollapsible(){
    const li = document.querySelector('nav.primary .is-collapsible');
    if (!li) return;
    const btn = li.querySelector('.subtoggle');
    const menu = li.querySelector('.dropdown');
    if (!btn || !menu) return;

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!isMobile()) return; // desktop uses hover dropdown
      const open = btn.getAttribute('aria-expanded') === 'true';
      const next = !open;
      btn.setAttribute('aria-expanded', String(next));
      menu.hidden = !next;
      menu.setAttribute('aria-hidden', String(!next));
      openMenu(); // ensure menu stays open while toggling
    });

    // initial collapsed state on mobile
    function setInitial(){
      if (isMobile()){
        btn.setAttribute('aria-expanded','false');
        menu.hidden = true;
        menu.setAttribute('aria-hidden','true');
      } else {
        // desktop shows dropdown normally; don't force hidden
        menu.hidden = false;
        menu.removeAttribute('aria-hidden');
        btn.setAttribute('aria-expanded','false');
      }
    }
    setInitial();
    window.matchMedia('(max-width:820px)').addEventListener('change', setInitial);
  })();

  // Click outside menu closes (mobile only)
  document.addEventListener('click', (e) => {
    if (!chk.checked || !isMobile()) return;
    if (e.target.closest('nav.primary') || e.target.closest('.nav-toggle-8')) return;
    closeMenu();
  }, true);

  chk.addEventListener('change', sync);
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', sync);
  } else {
    requestAnimationFrame(sync);
  }
})();

/* ===== Mark the current page in the nav (desktop + mobile) ===== */
(function markCurrentNav(){
  const normalize = (href) => {
    const url = new URL(href, location.origin);
    let p = url.pathname
      .replace(/\/+/g, "/")
      .replace(/\/index\.html?$/i, "")
      .replace(/\.html?$/i, "")
      .replace(/\/$/, "");
    return p === "" ? "/" : p;
  };

  const here = normalize(location.pathname);

  const apply = () => {
    const links = document.querySelectorAll('.topbar nav.primary a[href]');
    if (!links.length) return false;

    links.forEach(a => {
      const target = normalize(a.href);
      if (target === here) {
        a.setAttribute('aria-current','page');
        a.classList.add('is-current');
      } else {
        a.removeAttribute('aria-current');
        a.classList.remove('is-current');
      }
    });
    return true;
  };

  let tries = 0;
  const maxTries = 10;
  const tick = () => {
    if (apply() || ++tries >= maxTries) return;
    setTimeout(tick, 50);
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", tick, { once:true });
  }
  tick();
})();
</script>
