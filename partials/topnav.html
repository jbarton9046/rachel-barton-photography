<style>
/* Desktop keeps your regular header */
@media (min-width:821px){
  .desktop-only{ display:block !important; }
}
/* Mobile hides the desktop nav; shows overlay trigger */
@media (max-width:820px){
  .desktop-only{ display:none !important; }
}

/* Base header layout */
.topbar{
  position:relative; display:flex; align-items:center; justify-content:center;
  padding:16px var(--gap);
}

/* ==================== MOBILE HEADER CLUSTER (unchanged look) ==================== */
@media (max-width:820px){
  .topbar{ padding:8px var(--gap); justify-content:flex-start; }
  .left-cluster{ display:flex; align-items:center; gap:12px; }

  .nav-toggle-ol{
    -webkit-tap-highlight-color:transparent;
    position:relative; width:44px; height:26px; border:0; background:transparent; cursor:pointer; color:#2f2a24;
  }
  .nav-toggle-ol .bar{ position:absolute; left:0; height:2px; border-radius:999px; background:currentColor; opacity:.96;
    box-shadow:0 .5px 0 rgba(255,255,255,.45), 0 6px 12px rgba(0,0,0,.18); }
  .nav-toggle-ol .b-top{ width:14px; top:2px; left:50%; transform:translateX(-50%); }
  .nav-toggle-ol .b-mid{ width:20px; top:50%; left:50%; transform:translate(-50%,-50%); }
  .nav-toggle-ol .b-bot{ width:28px; bottom:2px; left:0; }

  .brand-name{ display:flex; flex-direction:column; line-height:1.02; color:#2f2a24; text-decoration:none;
    text-shadow:0 1px 0 rgba(255,255,255,.45), 0 8px 18px rgba(0,0,0,.18); }
  .rbp-1{ font-family:"Cormorant Garamond","Playfair Display",Georgia,serif; font-weight:700; font-size:18px; letter-spacing:.01em; }
  .rbp-2{ font-family:"Source Sans 3",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; font-weight:600; font-size:11.5px;
    letter-spacing:.18em; text-transform:uppercase; color:#6a5b45; margin-top:2px; }
}

/* ============================== MOBILE OVERLAY ============================== */
.navchk{ position:absolute; opacity:0; pointer-events:none; }

/* overlay container */
@media (max-width:820px){
  .mobile-overlay{
    position:fixed; inset:0; z-index:1400;
    display:grid; grid-template-rows:auto 1fr; align-content:start;
    background:rgba(62,62,58,.85); /* your ink tone, translucent */
    -webkit-backdrop-filter:saturate(1.05) blur(2px); backdrop-filter:saturate(1.05) blur(2px);
    color:#fff; opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .22s ease, visibility .22s ease;
  }
  /* open state */
  #navchk:checked ~ .mobile-overlay{ opacity:1; visibility:visible; pointer-events:auto; }

  /* close “X” */
  .ol-close{
    justify-self:end; margin:16px 16px 0 0; width:38px; height:38px;
    border:1px solid rgba(255,255,255,.55); color:#fff; background:transparent; font-size:24px; line-height:1;
    display:grid; place-items:center; border-radius:0; box-shadow:0 6px 18px rgba(0,0,0,.18);
  }

  /* centered column */
  .ol-nav{
    display:grid; align-content:center; justify-items:center; gap:12px;
    padding:10px 22px 28px;
  }

  /* big items with subtle lines — your fonts/colors */
  .ol-item{
    width:min(86vw, 480px);
    font-family:"Raleway","Source Sans 3",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    font-weight:600; letter-spacing:.18em; text-transform:uppercase;
    text-align:center; color:#efeee9; text-decoration:none;
    padding:12px 8px 14px;
    border-bottom:1px solid rgba(255,255,255,.55);
  }
  .ol-item:focus-visible, .ol-item:hover{ color:#e8dcc6; }

  /* button-style top-level (Galleries) */
  .ol-item.is-button{ display:flex; align-items:center; justify-content:center; gap:12px; background:transparent; border:0; cursor:pointer; }
  .ol-plus{ font-weight:700; opacity:.9; }

  /* sublinks area */
  .ol-sub{
    width:min(86vw, 480px); display:grid; gap:8px; padding:6px 0 10px; margin-bottom:8px;
    border-bottom:1px solid rgba(255,255,255,.22); max-height:0; overflow:hidden; transition:max-height .22s ease;
  }
  .ol-sub.open{ max-height:220px; }

  .ol-subitem{
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:"Cormorant Garamond","Playfair Display",Georgia,serif; font-weight:600;
    font-size:18px; text-transform:none; letter-spacing:.02em; color:#f6f5f2; text-decoration:none;
    padding:4px 0;
  }
  .ol-subitem .pipe{ opacity:.65; margin-right:6px; }
}

/* Keep desktop dropdown behavior untouched */
@media (min-width:821px){
  .mobile-overlay{ display:none !important; }
}
</style>

<script>
/* Mobile overlay open/close, collapsible Galleries, and “current page” flags */
(function(){
  const chk   = document.getElementById('navchk');
  const ol    = document.getElementById('mobile-overlay');
  const close = ol?.querySelector('.ol-close');
  const btn   = ol?.querySelector('.ol-item.is-button');
  const sub   = ol?.querySelector('.ol-sub');
  const label = document.querySelector('.nav-toggle-ol');

  function syncOpen(){
    const open = !!chk?.checked;
    if (label) label.setAttribute('aria-expanded', String(open));
    if (ol)    ol.setAttribute('aria-hidden', String(!open));
    document.body.classList.toggle('drawer-open', open); /* harmless class for any page shifts elsewhere */
  }

  function toggleSub(force){
    if (!btn || !sub) return;
    const open = force != null ? !!force : !sub.classList.contains('open');
    sub.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', String(open));
    btn.querySelector('.ol-plus')?.replaceChildren(document.createTextNode(open ? '–' : '+'));
  }

  // Open/close
  chk?.addEventListener('change', syncOpen);
  close?.addEventListener('click', ()=>{ chk.checked = false; syncOpen(); });

  // Click outside to close
  document.addEventListener('click', (e)=>{
    if (!chk?.checked) return;
    if (e.target.closest('#mobile-overlay') || e.target.closest('.nav-toggle-ol')) return;
    chk.checked = false; syncOpen();
  }, true);

  // Escape closes
  document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape' && chk?.checked){ chk.checked=false; syncOpen(); } });

  // Galleries expand/collapse
  btn?.addEventListener('click', ()=> toggleSub());

  // Follow any link -> close
  ol?.addEventListener('click', (e)=>{
    const a = e.target.closest('a');
    if (a){ chk.checked = false; syncOpen(); }
  });

  // Mark current page in overlay list too
  (function markCurrent(){
    const normalize = (href)=>{
      const u = new URL(href, location.origin);
      let p = u.pathname.replace(/\/+/g,'/').replace(/\/index\.html?$/i,'').replace(/\.html?$/i,'').replace(/\/$/,'');
      return p === '' ? '/' : p;
    };
    const here = normalize(location.pathname);
    document.querySelectorAll('.ol-nav a[href]').forEach(a=>{
      if (normalize(a.href) === here) a.style.color = 'var(--accent)';
    });
  })();

  // start closed, sub collapsed
  toggleSub(false);
  syncOpen();
})();
</script>
