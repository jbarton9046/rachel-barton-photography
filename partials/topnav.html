<!-- Option 8 styling (add these rules anywhere after layout.css is loaded) -->
<style>
  :root{
    /* tweak sizes here if you want */
    --ham-size: 28px;        /* overall button square */
    --ham-line: 20px;        /* bar length (middle is shorter via scale) */
    --ham-thick: 2.6px;      /* bar thickness */
    --ham-gap: 5.6px;        /* distance between bars */
  }

  /* cluster keeps brand + button side-by-side on mobile */
  .brand-cluster{
    display:flex; align-items:center; gap:10px;
  }

  /* Brand wordmark */
  .brand{
    display:flex; flex-direction:column; line-height:1.02; text-decoration:none;
  }
  .brand .rbp-title{
    font-family:"Cormorant Garamond","Playfair Display",serif;
    font-weight:700;
    letter-spacing:.01em;
  }
  .brand .rbp-sub{
    font-family:"Raleway","Source Sans 3",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    font-weight:700; letter-spacing:.18em;
    font-size:.70em; margin-top:2px;
  }

  /* Default (desktop) – keep your existing centered layout */
  @media (min-width:821px){
    .brand-cluster{ position:absolute; left:var(--gap); top:50%; transform:translateY(-50%); }
    .brand .rbp-title{ font-size:20px; }
  }

  /* Mobile layout: left align brand + hamburger; remove old fixed button styles */
  @media (max-width:820px){
    .topbar{ justify-content:flex-start !important; gap:12px; }
    .brand .rbp-title{ font-size:18px; }
    .brand .rbp-sub{ font-size:.62em; }

    /* Override any previous photo-icon styles for .nav-toggle */
    .nav-toggle{ 
      position:static !important; 
      width:var(--ham-size); height:var(--ham-size);
      display:inline-grid; place-items:center;
      border:1px solid var(--line); background:#fff; border-radius:0;
      box-shadow:0 6px 18px rgba(0,0,0,.06);
      padding:0; margin:0; cursor:pointer; z-index:1100;
    }
    .nav-toggle::before{ content:none !important; } /* kill the photo background */
    .nav-toggle .bar{ display:block !important; }

    /* Option 8 bars: rounded, middle slightly shorter, smooth morph */
    .ham-8{ position:relative; }
    .ham-8 .bar{
      position:relative; display:block;
      width:var(--ham-line); height:var(--ham-thick);
      background:var(--ink);
      border-radius:8px;
      transition:transform .24s ease, background-color .24s ease, opacity .24s ease, width .24s ease;
    }
    .ham-8 .bar + .bar{ margin-top:var(--ham-gap); }
    .ham-8 .bar:nth-child(2){ transform:scaleX(.82); transform-origin:center; } /* shorter middle */

    /* Hover tint */
    .ham-8:hover .bar{ background-color:var(--accent); }

    /* Morph to X when checked */
    #navchk:checked + label.ham-8 .bar:nth-child(1){
      transform:translateY(calc(var(--ham-gap) + var(--ham-thick))) rotate(45deg);
      background-color:var(--accent);
    }
    #navchk:checked + label.ham-8 .bar:nth-child(2){
      opacity:0; transform:scaleX(0.6);
    }
    #navchk:checked + label.ham-8 .bar:nth-child(3){
      transform:translateY(calc(-1 * (var(--ham-gap) + var(--ham-thick)))) rotate(-45deg);
      background-color:var(--accent);
    }

    /* Keep your drawer pushing behavior as-is (script already handles fallback) */
  }
</style>

<script>
  (function () {
    const chk = document.getElementById('navchk');
    if (!chk) return;

    const targets = () => [
      document.getElementById('content'),
      document.querySelector('[data-include="/partials/footer.html"]'),
      document.querySelector('.hero')
    ].filter(Boolean);

    const applyShift = (on) => {
      const tx = on ? 'translateX(var(--drawer-w))' : '';
      for (const el of targets()) el.style.transform = tx;
    };

    const sync = () => {
      document.body.classList.toggle('drawer-open', chk.checked);
      const label = document.querySelector('label[for="navchk"]');
      if (label) label.setAttribute('aria-expanded', String(chk.checked));
      applyShift(chk.checked);
    };

    const nav = document.getElementById('site-menu');
    if (nav) {
      nav.addEventListener('click', (e) => {
        const a = e.target.closest('a');
        if (a) { chk.checked = false; sync(); }
      });
    }

    document.addEventListener('click', (e) => {
      if (!chk.checked) return;
      if (e.target.closest('nav.primary') || e.target.closest('label[for="navchk"]')) return;
      chk.checked = false; sync();
    }, true);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && chk.checked) { chk.checked = false; sync(); }
    });

    chk.addEventListener('change', sync);
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', sync); else requestAnimationFrame(sync);
  })();
</script>
