<!-- /partials/topnav.html -->
<div class="topbar container mobile-header-8">
  <!-- drawer checkbox (mobile) -->
  <input id="navchk" class="navchk" type="checkbox" aria-hidden="true" />

  <!-- Left cluster: floating stepped lines + brand (MOBILE ONLY) -->
  <div class="left-cluster mobile-only">
    <label for="navchk"
           class="nav-toggle-8"
           aria-label="Open menu"
           role="button"
           aria-controls="site-menu"
           aria-expanded="false">
      <span class="bar b-top"></span>
      <span class="bar b-mid"></span>
      <span class="bar b-bot"></span>
    </label>

    <a class="brand-name" href="/" aria-label="Rachel Barton Photography – Home">
      <span class="rbp-1">Rachel Barton</span>
      <span class="rbp-2">Photography</span>
    </a>
  </div>

  <!-- Primary nav (desktop header, mobile drawer) -->
  <nav class="primary" id="site-menu" aria-label="Primary">
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/about.html">Meet Rachel</a></li>

      <li class="has-sub">
        <a href="/galleries.html" aria-haspopup="true" aria-expanded="false">Galleries</a>
        <ul class="dropdown" aria-label="Galleries submenu">
          <li><a href="/portraits.html">Portraits</a></li>
          <li><a href="/branding.html">Branding</a></li>
          <li><a href="/events.html">Events</a></li>
        </ul>
      </li>

      <li><a href="/testimonials.html">Testimonials</a></li>
      <li><a href="/faq.html">FAQ</a></li>
      <li><a href="/light-planner.html">Golden Hour</a></li>
      <li><a href="/contact.html">Contact</a></li>
      <li><a href="/book.html">Book</a></li>
    </ul>
  </nav>
</div>

<style>
/* desktop shows your regular header; hide the mobile cluster */
@media (min-width:821px){ .mobile-only{ display:none !important; } }
/* mobile hides any desktop-only bits */
@media (max-width:820px){ .desktop-only{ display:none !important; } }

/* base header wrapper */
.mobile-header-8{
  position:relative; display:flex; align-items:center; justify-content:center;
  padding:16px var(--gap);
}

/* =========================== MOBILE ONLY =========================== */
@media (max-width:820px){
  .mobile-header-8{
    position:fixed; top:8px; left:0; right:0; z-index:1200;
    padding:0 10px; background:transparent; justify-content:flex-start;
  }
  .mobile-header-8 .left-cluster{
    display:flex; align-items:center; gap:12px;
    transform:translateX(0); transition:transform .28s ease;
  }

  .nav-toggle-8{
    -webkit-tap-highlight-color:transparent;
    appearance:none; -webkit-appearance:none;
    position:relative;
    width:44px; height:26px;
    border:0; background:transparent !important; box-shadow:none !important; cursor:pointer;
    color:#2f2a24;
  }
  .nav-toggle-8 .bar{
    position:absolute; left:0;
    height:2px; border-radius:999px; background:currentColor; opacity:.96;
    box-shadow:0 .5px 0 rgba(255,255,255,.45), 0 6px 12px rgba(0,0,0,.18);
  }
  .nav-toggle-8 .b-bot{ width:28px; bottom:2px; left:0; }
  .nav-toggle-8 .b-mid{ width:20px; top:50%; transform:translate(-50%, -50%); left:50%; }
  .nav-toggle-8 .b-top{ width:14px; top:2px; left:50%; }

  .nav-toggle-8:active .bar{ opacity:.85; }

  .brand-name{
    display:inline-flex; flex-direction:column; justify-content:center;
    text-decoration:none; line-height:1.02; color:#2f2a24;
    text-shadow:0 1px 0 rgba(255,255,255,.45), 0 8px 18px rgba(0,0,0,.18);
  }
  .rbp-1{
    font-family:"Cormorant Garamond","Playfair Display",Georgia,serif;
    font-weight:700; font-size:18px; letter-spacing:.01em;
  }
  .rbp-2{
    font-family:"Source Sans 3",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    font-weight:600; font-size:11.5px; letter-spacing:.18em; text-transform:uppercase;
    color:#6a5b45; margin-top:2px;
  }

  .nav-toggle{ background:transparent !important; border:0 !important; box-shadow:none !important; }
}

/* shift the whole left cluster same as page when drawer opens */
@media (max-width:820px){
  body:has(#navchk:checked) .mobile-header-8 .left-cluster,
  body.drawer-open .mobile-header-8 .left-cluster{
    transform:translateX(var(--drawer-w));
  }
}
</style>

<script>
/* drawer logic + shift content and the new mobile header cluster */
(function () {
  const chk = document.getElementById('navchk');
  if (!chk) return;

  const targets = () => [
    document.getElementById('content'),
    document.querySelector('[data-include="/partials/footer.html"]'),
    document.querySelector('.hero'),
    document.querySelector('.mobile-header-8 .left-cluster')
  ].filter(Boolean);

  const applyShift = (on) => {
    const tx = on ? 'translateX(var(--drawer-w))' : '';
    for (const el of targets()) el.style.transform = tx;
  };

  const sync = () => {
    document.body.classList.toggle('drawer-open', chk.checked);
    const label = document.querySelector('.nav-toggle-8');
    if (label) label.setAttribute('aria-expanded', String(chk.checked));
    applyShift(chk.checked);
  };

  const nav = document.getElementById('site-menu');
  if (nav) {
    nav.addEventListener('click', (e) => {
      const a = e.target.closest('a');
      if (a) { chk.checked = false; sync(); }
    });
  }

  document.addEventListener('click', (e) => {
    if (!chk.checked) return;
    if (e.target.closest('nav.primary') || e.target.closest('.nav-toggle-8')) return;
    chk.checked = false; sync();
  }, true);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && chk.checked) { chk.checked = false; sync(); }
  });

  chk.addEventListener('change', sync);
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', sync);
  } else {
    requestAnimationFrame(sync);
  }
})();

/* ===== Mark the current page in the nav (desktop + mobile) ===== */
(function markCurrentNav(){
  // Normalize any href/path: remove /index.html, .html, trailing slash; collapse double slashes
  const normalize = (href) => {
    const url = new URL(href, location.origin);
    let p = url.pathname
      .replace(/\/+/g, "/")
      .replace(/\/index\.html?$/i, "")
      .replace(/\.html?$/i, "")
      .replace(/\/$/, "");
    return p === "" ? "/" : p;
  };

  const here = normalize(location.pathname);

  const apply = () => {
    document.querySelectorAll('.topbar nav.primary a[href]').forEach(a => {
      const target = normalize(a.href);
      if (target === here) {
        a.setAttribute('aria-current','page');  // mobile drawer style hook
        a.classList.add('is-current');          // desktop underline hook
      } else {
        a.removeAttribute('aria-current');
        a.classList.remove('is-current');
      }
    });
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", apply, { once:true });
  }
  apply();
})();
</script>
