<!-- TOP NAV (mobile-only header cluster: hamburger + brand on the left) -->
<div class="topbar container mobile-header-8">
  <!-- checkbox hack for the drawer -->
  <input id="navchk" class="navchk" type="checkbox" aria-hidden="true" />

  <!-- Left cluster: hamburger first, brand next -->
  <div class="left-cluster">
    <!-- Option 8: floating three lines (no background) -->
    <label for="navchk"
           class="nav-toggle-8"
           aria-label="Open menu"
           role="button"
           aria-controls="site-menu"
           aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </label>

    <!-- Brand to the RIGHT of the hamburger -->
    <a class="brand-name" href="/" aria-label="Rachel Barton Photography – Home">
      <span class="rbp-1">Rachel Barton</span>
      <span class="rbp-2">Photography</span>
    </a>
  </div>

  <!-- Drawer nav (unchanged) -->
  <nav class="primary" id="site-menu" aria-label="Primary">
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/about.html">Meet Rachel</a></li>

      <li class="has-sub">
        <a href="/galleries.html" aria-haspopup="true" aria-expanded="false">Galleries</a>
        <ul class="dropdown" aria-label="Galleries submenu">
          <li><a href="/portraits.html">Portraits</a></li>
          <li><a href="/branding.html">Branding</a></li>
          <li><a href="/events.html">Events</a></li>
        </ul>
      </li>

      <li><a href="/testimonials.html">Testimonials</a></li>
      <li><a href="/faq.html">FAQ</a></li>
      <li><a href="/contact.html">Contact</a></li>
      <li><a href="/book.html">Book</a></li>
    </ul>
  </nav>
</div>

<style>
/* Hide the mobile cluster on desktop */
@media (min-width:821px){
  .mobile-header-8 .left-cluster{ display:none !important; }
}

/* Mobile-only header polish */
@media (max-width:820px){
  .mobile-header-8{
    position:fixed; top:8px; left:0; right:0;
    display:flex; align-items:center; justify-content:flex-start;
    padding:0 10px; z-index:1200; background:transparent;
  }
  .mobile-header-8 .left-cluster{
    display:flex; align-items:center; gap:10px;
  }

  /* Option 8 hamburger: floating lines, no background box */
  .mobile-header-8 .nav-toggle-8{
    appearance:none; -webkit-appearance:none;
    display:inline-flex; align-items:center; justify-content:center;
    width:auto; height:auto; padding:12px;
    cursor:pointer; border:0; background:transparent !important; box-shadow:none !important;
    color:#2f2a24; /* bars inherit this */
  }
  .mobile-header-8 .nav-toggle-8 .bar{
    display:block; width:26px; height:2px; border-radius:2px;
    background:currentColor;
    box-shadow:0 .5px 0 rgba(255,255,255,.45), 0 6px 10px rgba(0,0,0,.18); /* subtle visibility */
  }
  .mobile-header-8 .nav-toggle-8 .bar + .bar{ margin-top:5px }
  .mobile-header-8 .nav-toggle-8:active .bar{ transform:scaleX(.96) }

  /* Brand immediately to the right of the hamburger */
  .mobile-header-8 .brand-name{
    display:inline-flex; flex-direction:column; justify-content:center;
    text-decoration:none; line-height:1.02; color:#2f2a24;
    text-shadow:0 1px 0 rgba(255,255,255,.45), 0 8px 18px rgba(0,0,0,.18); /* readable over photo */
  }
  .mobile-header-8 .rbp-1{
    font-family:"Cormorant Garamond","Playfair Display",Georgia,serif;
    font-weight:700; font-size:18px; letter-spacing:.01em;
  }
  .mobile-header-8 .rbp-2{
    font-family:"Source Sans 3",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    font-weight:600; font-size:11.5px; letter-spacing:.18em; text-transform:uppercase;
    color:#6a5b45;
  }

  /* Ensure any older icon styles don't add backgrounds */
  .nav-toggle{ background:transparent !important; border:0 !important; box-shadow:none !important; }
}
</style>

<script>
/* Same drawer logic; updated to watch the new label selector */
(function () {
  const chk = document.getElementById('navchk');
  if (!chk) return;

  const targets = () => [
    document.getElementById('content'),
    document.querySelector('[data-include="/partials/footer.html"]'),
    document.querySelector('.hero')
  ].filter(Boolean);

  const applyShift = (on) => {
    const tx = on ? 'translateX(var(--drawer-w))' : '';
    for (const el of targets()) el.style.transform = tx;
  };

  const sync = () => {
    document.body.classList.toggle('drawer-open', chk.checked);
    const label = document.querySelector('.nav-toggle-8');
    if (label) label.setAttribute('aria-expanded', String(chk.checked));
    applyShift(chk.checked);
  };

  const nav = document.getElementById('site-menu');
  if (nav) {
    nav.addEventListener('click', (e) => {
      const a = e.target.closest('a');
      if (a) { chk.checked = false; sync(); }
    });
  }

  document.addEventListener('click', (e) => {
    if (!chk.checked) return;
    if (e.target.closest('nav.primary') || e.target.closest('.nav-toggle-8')) return;
    chk.checked = false; sync();
  }, true);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && chk.checked) { chk.checked = false; sync(); }
  });

  chk.addEventListener('change', sync);
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', sync);
  } else {
    requestAnimationFrame(sync);
  }
})();
</script>
