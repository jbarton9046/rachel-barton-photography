<!-- MOBILE HEADER (option 8) -->
<div class="topbar container mobile-header-8">
  <!-- drawer checkbox -->
  <input id="navchk" class="navchk" type="checkbox" aria-hidden="true" />

  <!-- Left cluster: icon + brand (left-aligned) -->
  <div class="left-cluster">
    <!-- OPTION 8: floating stepped lines, no background -->
    <label for="navchk"
           class="nav-toggle-8"
           aria-label="Open menu"
           role="button"
           aria-controls="site-menu"
           aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </label>

    <!-- Brand to the RIGHT of the lines -->
    <a class="brand-name" href="/" aria-label="Rachel Barton Photography – Home">
      <span class="rbp-1">Rachel Barton</span>
      <span class="rbp-2">PHOTOGRAPHY</span>
    </a>
  </div>

  <!-- Drawer (unchanged) -->
  <nav class="primary" id="site-menu" aria-label="Primary">
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/about.html">Meet Rachel</a></li>
      <li class="has-sub">
        <a href="/galleries.html" aria-haspopup="true" aria-expanded="false">Galleries</a>
        <ul class="dropdown" aria-label="Galleries submenu">
          <li><a href="/portraits.html">Portraits</a></li>
          <li><a href="/branding.html">Branding</a></li>
          <li><a href="/events.html">Events</a></li>
        </ul>
      </li>
      <li><a href="/testimonials.html">Testimonials</a></li>
      <li><a href="/faq.html">FAQ</a></li>
      <li><a href="/contact.html">Contact</a></li>
      <li><a href="/book.html">Book</a></li>
    </ul>
  </nav>
</div>

<style>
/* Hide this whole cluster on desktop */
@media (min-width:821px){
  .mobile-header-8{ display:none !important; }
}

/* MOBILE ONLY */
@media (max-width:820px){
  .mobile-header-8{
    position:fixed; inset:auto 0 auto 0; top:10px;
    display:flex; align-items:center; justify-content:flex-start;
    padding:0 12px; gap:0; z-index:1200; background:transparent;
    transition:transform .28s ease; will-change:transform;
  }

  .mobile-header-8 .left-cluster{
    display:flex; align-items:center; gap:12px; /* spacing between icon and brand */
  }

  /* ---- Option 8: FLOATING stepped bars (no background) ---- */
  .mobile-header-8 .nav-toggle-8{
    appearance:none; -webkit-appearance:none;
    display:inline-flex; align-items:center; justify-content:center;
    width:auto; height:auto; padding:8px 6px; cursor:pointer;
    border:0; background:transparent !important; box-shadow:none !important;
    color:#2f2a24; /* bars use currentColor */
  }
  .mobile-header-8 .nav-toggle-8 .bar{
    display:block; height:2px; border-radius:2px; background:currentColor;
    /* subtle readability over photo */
    box-shadow:0 .5px 0 rgba(255,255,255,.45), 0 6px 10px rgba(0,0,0,.18);
    transition:transform .18s ease, opacity .18s ease;
  }
  /* stepped widths & offsets (matches the option sheet look) */
  .mobile-header-8 .nav-toggle-8 .bar:nth-child(1){ width:16px; transform:translateX(8px); }
  .mobile-header-8 .nav-toggle-8 .bar:nth-child(2){ width:22px; transform:translateX(4px); margin-top:5px; }
  .mobile-header-8 .nav-toggle-8 .bar:nth-child(3){ width:28px; transform:translateX(0);   margin-top:5px; }
  .mobile-header-8 .nav-toggle-8:active .bar{ transform:translateX(0) scaleX(.96); }

  /* Brand to the RIGHT of the icon, left-aligned as a unit */
  .mobile-header-8 .brand-name{
    display:inline-flex; flex-direction:column; justify-content:center;
    text-decoration:none; line-height:1.02; color:#2f2a24;
    text-shadow:0 1px 0 rgba(255,255,255,.45), 0 8px 18px rgba(0,0,0,.18);
  }
  .mobile-header-8 .rbp-1{
    font-family:"Cormorant Garamond","Playfair Display",Georgia,serif;
    font-weight:700; font-size:18px; letter-spacing:.01em;
  }
  .mobile-header-8 .rbp-2{
    font-family:"Source Sans 3",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    font-weight:600; font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:#6a5b45;
  }

  /* Make the header cluster slide with the drawer (CSS + JS fallback) */
  body:has(#navchk:checked) .mobile-header-8{ transform:translateX(var(--drawer-w)); }
  body.drawer-open .mobile-header-8{ transform:translateX(var(--drawer-w)); } /* fallback */
}
</style>

<script>
/* Same drawer logic; keep the header cluster moving with it */
(function () {
  const chk = document.getElementById('navchk');
  if (!chk) return;

  const targets = () => [
    document.getElementById('content'),
    document.querySelector('[data-include="/partials/footer.html"]'),
    document.querySelector('.hero')
  ].filter(Boolean);

  const applyShift = (on) => {
    const tx = on ? 'translateX(var(--drawer-w))' : '';
    for (const el of targets()) el.style.transform = tx;
    // move the header too (fallback when :has() isn't available)
    document.body.classList.toggle('drawer-open', on);
    const label = document.querySelector('.nav-toggle-8');
    if (label) label.setAttribute('aria-expanded', String(on));
  };

  const nav = document.getElementById('site-menu');
  if (nav) {
    nav.addEventListener('click', (e) => {
      const a = e.target.closest('a');
      if (a) { chk.checked = false; applyShift(false); }
    });
  }

  document.addEventListener('click', (e) => {
    if (!chk.checked) return;
    if (e.target.closest('nav.primary') || e.target.closest('.nav-toggle-8')) return;
    chk.checked = false; applyShift(false);
  }, true);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && chk.checked) { chk.checked = false; applyShift(false); }
  });

  chk.addEventListener('change', () => applyShift(chk.checked));
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => applyShift(chk.checked));
  } else {
    requestAnimationFrame(() => applyShift(chk.checked));
  }
})();
</script>
