<!-- /partials/topnav.html -->
<div class="topbar container mobile-header-8">
  <!-- checkbox controls the left drawer (works for mobile; harmless on desktop) -->
  <input id="navchk" class="navchk" type="checkbox" aria-hidden="true" />

  <!-- LEFT CLUSTER (mobile only): Option 8 hamburger + brand -->
  <div class="left-cluster mobile-only">
    <label for="navchk"
           class="nav-toggle-8"
           aria-label="Open menu"
           role="button"
           aria-controls="site-menu"
           aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </label>

    <a class="brand-name" href="/" aria-label="Rachel Barton Photography – Home">
      <span class="rbp-1">Rachel Barton</span>
      <span class="rbp-2">Photography</span>
    </a>
  </div>

  <!-- PRIMARY NAV (desktop = horizontal bar; mobile = left drawer) -->
  <nav class="primary" id="site-menu" aria-label="Primary">
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/about.html">Meet Rachel</a></li>

      <li class="has-sub">
        <a href="/galleries.html" aria-haspopup="true" aria-expanded="false">Galleries</a>
        <ul class="dropdown" aria-label="Galleries submenu">
          <li><a href="/portraits.html">Portraits</a></li>
          <li><a href="/branding.html">Branding</a></li>
          <li><a href="/events.html">Events</a></li>
        </ul>
      </li>

      <li><a href="/testimonials.html">Testimonials</a></li>
      <li><a href="/faq.html">FAQ</a></li>
      <li><a href="/contact.html">Contact</a></li>
      <li><a href="/book.html">Book</a></li>
    </ul>
  </nav>
</div>

<style>
/* Helpers to explicitly show/hide clusters by breakpoint */
@media (min-width:821px){ .mobile-only{ display:none !important; } }
@media (max-width:820px){ .desktop-only{ display:none !important; } }

/* Keep the header visible and aligned on both views */
.mobile-header-8{
  position:relative;
  display:flex; align-items:center; justify-content:center;
  padding:16px var(--gap);
}

/* ===================== MOBILE-ONLY HEADER CLUSTER ===================== */
@media (max-width:820px){
  .mobile-header-8{
    position:fixed; top:8px; left:0; right:0; z-index:1200;
    padding:0 10px;
    background:transparent;
    justify-content:flex-start;
  }
  .mobile-header-8 .left-cluster{
    display:flex; align-items:center; gap:12px;
    transform:translateX(0); transition:transform .28s ease; /* shifts with drawer */
  }

  /* Option 8 hamburger — floating, stepped, thin lines (NO background box) */
  .mobile-header-8 .nav-toggle-8{
    -webkit-tap-highlight-color:transparent;
    appearance:none; -webkit-appearance:none;
    display:inline-flex; align-items:center; justify-content:center;
    padding:10px 8px; border:0; background:transparent !important; box-shadow:none !important;
    cursor:pointer; color:#2f2a24;
  }
  .mobile-header-8 .nav-toggle-8 .bar{
    display:block; height:2px; border-radius:999px; background:currentColor; opacity:.95;
  }
  /* stepped (short → medium → long) using precise widths & left margins */
  .mobile-header-8 .nav-toggle-8 .bar:nth-child(1){ width:12px; margin-left:10px; }
  .mobile-header-8 .nav-toggle-8 .bar:nth-child(2){ width:18px; margin-left:5px;  margin-top:5px; }
  .mobile-header-8 .nav-toggle-8 .bar:nth-child(3){ width:24px; margin-left:0;   margin-top:5px; }
  .mobile-header-8 .nav-toggle-8:active .bar{ opacity:.85; }

  /* Brand immediately to the right of the hamburger; classic, elegant */
  .mobile-header-8 .brand-name{
    display:inline-flex; flex-direction:column; justify-content:center;
    text-decoration:none; line-height:1.02; color:#2f2a24;
    text-shadow:0 1px 0 rgba(255,255,255,.45), 0 8px 18px rgba(0,0,0,.18);
  }
  .mobile-header-8 .rbp-1{
    font-family:"Cormorant Garamond","Playfair Display",Georgia,serif;
    font-weight:700; font-size:18px; letter-spacing:.01em;
  }
  .mobile-header-8 .rbp-2{
    font-family:"Source Sans 3",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    font-weight:600; font-size:11.5px; letter-spacing:.18em; text-transform:uppercase;
    color:#6a5b45;
    margin-top:2px;
  }

  /* Make sure any older .nav-toggle styles never add backgrounds */
  .nav-toggle{ background:transparent !important; border:0 !important; box-shadow:none !important; }
}

/* When the drawer is open, nudge the mobile header over the same distance */
@media (max-width:820px){
  body:has(#navchk:checked) .mobile-header-8 .left-cluster,
  body.drawer-open .mobile-header-8 .left-cluster{
    transform:translateX(var(--drawer-w));
  }
}
</style>

<script>
/* Drawer behavior + shift the hero/content/footer AND the mobile header cluster */
(function () {
  const chk = document.getElementById('navchk');
  if (!chk) return;

  const targets = () => [
    document.getElementById('content'),
    document.querySelector('[data-include="/partials/footer.html"]'),
    document.querySelector('.hero'),
    document.querySelector('.mobile-header-8 .left-cluster') /* shift the header cluster too */
  ].filter(Boolean);

  const applyShift = (on) => {
    const tx = on ? 'translateX(var(--drawer-w))' : '';
    for (const el of targets()) el.style.transform = tx;
  };

  const sync = () => {
    document.body.classList.toggle('drawer-open', chk.checked);
    const label = document.querySelector('.nav-toggle-8');
    if (label) label.setAttribute('aria-expanded', String(chk.checked));
    applyShift(chk.checked);
  };

  /* Close drawer when a menu link is tapped (mobile nicety) */
  const nav = document.getElementById('site-menu');
  if (nav) {
    nav.addEventListener('click', (e) => {
      const a = e.target.closest('a');
      if (a) { chk.checked = false; sync(); }
    });
  }

  /* Outside click closes the drawer without blocking underlying actions */
  document.addEventListener('click', (e) => {
    if (!chk.checked) return;
    if (e.target.closest('nav.primary') || e.target.closest('.nav-toggle-8')) return;
    chk.checked = false; sync();
  }, true);

  /* ESC closes the drawer */
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && chk.checked) { chk.checked = false; sync(); }
  });

  chk.addEventListener('change', sync);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', sync);
  } else {
    requestAnimationFrame(sync);
  }
})();
</script>
