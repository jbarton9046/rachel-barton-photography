<footer class="site-footer mini">
  <div class="container footer-wrap">
    <div class="copyright">© <span id="year"></span> Rachel Barton Photography · Sarasota, FL</div>

    <ul class="footer-links" aria-label="Contact & social links">
      <li><a href="mailto:rachelbartonphotography@gmail.com">rachelbartonphotography@gmail.com</a></li>
      <!-- phone number removed -->
      <li>
        <a
          class="icon-btn ig"
          href="https://www.instagram.com/therachelbartonphoto?igsh=aXB0YzYyZ3NjZjQ5&utm_source=qr"
          target="_blank"
          rel="me noopener noreferrer"
          aria-label="Instagram: @therachelbartonphoto"
          title="Instagram"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect>
            <circle cx="12" cy="12" r="4.2"></circle>
            <circle cx="17.5" cy="6.5" r="1.3"></circle>
          </svg>
        </a>
      </li>
      <li>
        <a
          class="icon-btn px"
          href="https://rachelbartonphotography38.pixieset.com/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Pixieset client galleries"
          title="Pixieset"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect>
            <path d="M9 8v8" />
            <path d="M9 10.5h2.2a2.2 2.2 0 1 0 0-4.4H9" />
            <path d="M14.4 14.2l3.2 3.2" />
            <path d="M17.6 14.2l-3.2 3.2" />
          </svg>
        </a>
      </li>
    </ul>
  </div>

  <style>
    /* mobile safe-area + bottom-toolbar space shared by footer and page */
    :root{
      --footer-boost: clamp(28px, env(safe-area-inset-bottom, 0px) + 40px, 72px);
    }

    .site-footer.mini{
      padding: 8px 0 var(--footer-boost);
      font-size: 14px;
      line-height: 1.2;
      position: relative;
      z-index: 1;
    }

    .footer-wrap{
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; flex-wrap:nowrap;
    }

    .copyright{ white-space:nowrap; }

    .footer-links{
      display:flex; align-items:center; gap:10px;
      list-style:none; padding:0; margin:0;
      white-space:nowrap;
    }
    .footer-links li{ display:inline-flex; align-items:center; }
    .footer-links li + li::before{
      content:"·"; opacity:.55; margin:0 6px;
    }

    .footer-links a{
      color:inherit; text-decoration:none; transition:color .15s ease;
    }
    .footer-links a:hover{ color:var(--accent); }

    .icon-btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding:6px; margin:-4px; border-radius:6px;
    }
    .icon-btn svg{
      width:1em; height:1em;
      stroke:currentColor; fill:none; stroke-width:1.6; display:block;
    }

    /* ===== Mobile: two clean lines (copyright row, then links row) ===== */
    @media (max-width:640px){
      .site-footer.mini{ font-size:12px; }
      .footer-wrap{
        flex-direction:column; align-items:center; justify-content:center;
        gap:8px;
      }
      .copyright{
        width:100%; text-align:center;
        white-space:normal; /* allow wrap on tiny screens */
      }
      .footer-links{
        flex-wrap:wrap; justify-content:center; gap:8px;
        white-space:normal; /* wrap into a single tidy line or two */
      }
      .footer-links li + li::before{ margin:0 5px; }
      .icon-btn{ padding:4px; margin:-3px; }
      .icon-btn svg{ width:.95em; height:.95em; }
    }

    @media (prefers-reduced-motion:reduce){
      .footer-links a{ transition:none; }
    }

    /* Give the page some bottom padding on phones so the footer can scroll fully above the browser toolbar */
    @media (max-width:640px){
      main{ padding-bottom: var(--footer-boost); }
    }
  </style>

  <script>
    (function(){
      try { document.getElementById('year').textContent = new Date().getFullYear(); } catch(e){}
    })();
  </script>
</footer>
