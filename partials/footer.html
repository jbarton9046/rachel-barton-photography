  <!-- Scoped footer styles -->
  <style>
    .site-footer{
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    }

    .footer-wrap{
      display:flex; flex-wrap:wrap; gap:10px 20px;
      align-items:center; justify-content:space-between;
      /* desktop keeps your swapped sides look */
      flex-direction:row-reverse;
    }
    .copyright{ text-align:right; }

    /* Link row becomes centered, wraps cleanly on phones */

      display:flex; flex-wrap:wrap; align-items:center;
      gap:8px 10px; list-style:none; padding:0; margin:0;
    }
    .footer-links li{ display:inline-flex; align-items:center; }

    /* Dots appear BEFORE wrapped items (no trailing dot at line ends) */
    .footer-links li + li::before{
      content:"·"; opacity:.55; margin:0 6px; line-height:1;
    }

    .footer-links a{
      color:inherit; text-decoration:none; transition:color .15s ease;
    }
    .footer-links a:hover{ color:var(--accent); }

    /* Icon buttons: bigger touch target but visually light */
    .icon-btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding:8px; margin:-6px; /* increases hit area without shifting layout */
      border-radius:8px;
    }
    .icon-btn svg{
      width:1.05em; height:1.05em;
      stroke:currentColor; fill:none; stroke-width:1.6; display:block;
    }

    /* Mobile layout */
    @media (max-width:640px){
      .footer-wrap{ justify-content:center; gap:8px 16px; }
      .copyright{ text-align:center; width:100%; }
    }

    @media (prefers-reduced-motion:reduce){
      .footer-links a{ transition:none; }
    }
