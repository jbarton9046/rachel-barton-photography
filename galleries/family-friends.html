  <style>
    :root{
      --bg:#FAFAF8; --paper:#ffffff; --ink:#3e3e3a; --muted:#7a766e;
      --accent:#A88A5A; --line:#e9e6df; --shadow:0 10px 30px rgba(0,0,0,.08);
      --gap:clamp(16px,3vw,32px); --maxw:1200px;
      --nav-gap-top:16px; --nav-gap-bottom:40px;
      --mobile-header-h:64px;

      /* tile controls */
      --arrow-size:28px;
      --arrow-inset:10px;
      --glass-bg: rgba(255,255,255,.28);
      --glass-blur: blur(7px) saturate(1.05);
      --glass-border: 1px solid rgba(63,58,51,.18);
      --glass-shadow: 0 10px 22px rgba(0,0,0,.10);
    }

    .topbar{ padding-top:var(--nav-gap-top)!important; padding-bottom:var(--nav-gap-bottom)!important; }
    .nav-spacer, .page-top-spacer { height:0!important; }

    .topbar nav a,
    .topbar .nav a,
    .topbar [role="navigation"] a { font-weight:400 !important; }

    *{ box-sizing:border-box }
    html,body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Source Sans 3",system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif; line-height:1.65 }
    a{ color:inherit; text-decoration:none; transition:color .15s ease, border-color .15s ease }
    a:hover, a:focus-visible{ color:var(--accent); outline:none }
    img{ max-width:100%; height:auto; display:block; border:1px solid var(--line); box-shadow:0 6px 18px rgba(0,0,0,.06) }
    .container{ max-width:var(--maxw); margin:0 auto; padding:0 var(--gap) }

    .btn{
      font-family:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;
      display:inline-flex; align-items:center; justify-content:center;
      padding:10px 16px; background:#fff; color:#3f3a33;
      border:1px solid var(--line); border-radius:0; font-weight:700; text-decoration:none;
      box-shadow:0 6px 18px rgba(0,0,0,.06);
      transition:background-color .15s ease, border-color .15s ease, box-shadow .15s ease, transform .15s ease, color .15s ease;
    }
    .btn:hover, .btn:focus-visible{
      background:#fff; border-color:#dcd4c3; color:var(--accent);
      box-shadow:0 10px 24px rgba(0,0,0,.08); transform:translateY(-1px); outline:none;
    }
    .btn.alt{ background:#fff; }

    /* Hero header */
    .hero{ padding:clamp(24px,6vw,56px) 0 }
    .eyebrow{ font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:#6e6a62 }
    .h1{ font-family:"Cormorant Garamond","Playfair Display",Georgia,serif; font-weight:700; font-size:clamp(32px,5vw,56px); line-height:1.08; margin:8px 0 10px }
    .lead{ font-size:clamp(16px,2.3vw,20px); color:#58554e; max-width:70ch }

    .crumb{ font-size:14px; color:#7a766e; margin-bottom:6px }
    .crumb a{ text-decoration:underline; text-underline-offset:3px }

    /* Mosaic */
    .mosaic{ display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(12px,1.6vw,16px) }
    @media (max-width:1080px){ .mosaic{ grid-template-columns:repeat(2,1fr) } }
    @media (max-width:740px){ .mosaic{ grid-template-columns:1fr } }

    figure.tile{
      margin:0; position:relative; aspect-ratio:4/5; overflow:hidden;
      border-radius:0; border:1px solid var(--line); background:#ddd;
      box-shadow:0 6px 18px rgba(0,0,0,.06); isolation:isolate;
      transition:transform .2s ease, box-shadow .2s ease; cursor:pointer;
    }
    figure.tile:hover{ transform:translateY(-2px) }
    .tile-media{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; display:block }
    .tile-title{
      position:absolute; left:12px; bottom:12px; z-index:3;
      background:rgba(255,255,255,.75); border:1px solid var(--line); padding:6px 10px;
      font-family:"Cormorant Garamond","Playfair Display",Georgia,serif; font-weight:700; font-size:18px;
      box-shadow:0 6px 18px rgba(0,0,0,.08);
      -webkit-backdrop-filter:saturate(1.05) blur(.5px); backdrop-filter:saturate(1.05) blur(.5px);
    }

    /* arrows */
    .tile-nav{
      position:absolute; top:50%; transform:translateY(-50%) scale(.98);
      width:var(--arrow-size); height:var(--arrow-size);
      display:grid; place-items:center; color:var(--accent); cursor:pointer; user-select:none;
      border:0; background:transparent; z-index:5; opacity:0;
      transition:opacity .2s ease, transform .2s ease;
    }
    figure.tile:hover .tile-nav{ opacity:1; transform:translateY(-50%) scale(1) }
    .tile-prev{ left:var(--arrow-inset) } .tile-next{ right:var(--arrow-inset) }
    .tile-nav::before{
      content:""; position:absolute; inset:0; margin:4px;
      transform:rotate(45deg);
      background:var(--glass-bg); -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
      border:var(--glass-border); box-shadow:var(--glass-shadow);
    }
    .tile-nav svg{ width:12px; height:12px; position:relative; z-index:1 }

    footer{ border-top:1px solid var(--line); padding:28px 0; color:#7f7f7f }

    /* ---------- MOBILE ONLY ---------- */
    @media (max-width:820px){
      html, body{ overflow-x:hidden; }
      .hero{ padding-top: calc(var(--mobile-header-h) + 10px); }
      .topbar{ padding-top:8px !important; padding-bottom:12px !important; }

      /* Keep chevrons visible on mobile */
      .tile-nav{ opacity:1 !important; transform:translateY(-50%) scale(1) !important; }

      /* Prevent double-shift while the drawer opens */
      #content{
        position:relative !important;
        left:0 !important; right:0 !important; margin-left:0 !important;
        transform:none !important; max-width:100% !important; width:100% !important;
      }
      body.nav-open #content,
      body.menu-open #content,
      html.nav-open #content,
      .nav-open #content,
      .menu-open #content,
      [data-nav-open="1"] #content{
        transform:none !important; margin-left:0 !important; left:0 !important; right:0 !important;
      }
      body.nav-open #content .container,
      body.menu-open #content .container,
      html.nav-open #content .container,
      .nav-open #content .container,
      .menu-open #content .container,
      [data-nav-open="1"] #content .container{
        transform:none !important;
        margin-left:0 !important; left:auto !important; right:auto !important;
      }

      /* Ensure all four tiles show on 1-col */
      @media (max-width:740px){
        .mosaic .tile{ grid-column:auto !important; }
      }
    }
  </style>

  <script>
    (function(){
      const MAX_IMGS = 10;
      function shuffled(arr){
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--){
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }
      document.querySelectorAll('figure.tile').forEach(tile=>{
        const media   = tile.querySelector('.tile-media');
        const prevBtn = tile.querySelector('.tile-prev');
        const nextBtn = tile.querySelector('.tile-next');
        const link    = tile.getAttribute('data-link');
        const preferred = (tile.getAttribute('data-preferred') || '').trim();

        let all = [];
        try { all = JSON.parse(tile.getAttribute('data-all-images') || '[]'); } catch{}
        if (!Array.isArray(all) || !all.length) return;

        const others = all.filter(src => src !== preferred);
        const list   = preferred ? [preferred, ...shuffled(others).slice(0, Math.max(0, MAX_IMGS - 1))]
                                 : shuffled(all).slice(0, MAX_IMGS);

        let idx = 0;
        function show(i){
          idx = (i + list.length) % list.length;
          const src = list[idx];
          if (src) media.src = src;
        }
        show(0);

        prevBtn?.addEventListener('click', e => { e.stopPropagation(); show(idx - 1); });
        nextBtn?.addEventListener('click', e => { e.stopPropagation(); show(idx + 1); });
        tile.addEventListener('click', e => {
          if (e.target.closest('.tile-nav')) return;
          if (link) window.location.href = link;
        });

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(()=> show(0));
        } else {
          window.addEventListener('load', ()=> show(0));
        }
      });
    })();
  </script>
