  <style>
    :root{
      --bg:#FAFAF8; --paper:#ffffff; --ink:#3e3e3a; --muted:#7a766e;
      --accent:#A88A5A; --line:#e9e6df; --shadow:0 10px 30px rgba(0,0,0,.08);
      --gap:clamp(16px,3vw,32px); --maxw:1200px;
      --nav-gap-top:16px; --nav-gap-bottom:40px;
      --mobile-header-h:64px;

      /* tile controls */
      --arrow-size:28px;
      --arrow-inset:10px;
      --glass-bg: rgba(255,255,255,.28);
      --glass-blur: blur(7px) saturate(1.05);
      --glass-border: 1px solid rgba(63,58,51,.18);
      --glass-shadow: 0 10px 22px rgba(0,0,0,.10);
    }

    /* Base */
    *{ box-sizing:border-box }
    html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); }
    body{
      font-family:"Source Sans 3", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      line-height:1.6; letter-spacing:.01em;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    }
    h1,h2,h3,h4{ font-family:"Playfair Display","Cormorant Garamond", Georgia, "Times New Roman", serif; margin:0 0 8px }
    .h1{ font-size:clamp(28px,4.6vw,52px); line-height:1.12; letter-spacing:.01em }
    .lead{ font-size:clamp(16px,2.2vw,20px); color:#4b463f; margin:10px 0 0 }
    a{ color:inherit; text-decoration:none; transition:color .15s ease, border-color .15s ease }
    a:hover, a:focus-visible{ color:var(--accent); outline:none }
    img{ max-width:100%; height:auto; display:block; border:1px solid var(--line); box-shadow:0 6px 18px rgba(0,0,0,.06) }
    .container{ max-width:var(--maxw); margin:0 auto; padding:0 var(--gap) }

    .btn{
      font-family:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;
      display:inline-flex; align-items:center; justify-content:center;
      padding:10px 16px; background:#fff; color:#3f3a33;
      border:1px solid var(--line); border-radius:0; font-weight:700; text-decoration:none;
      box-shadow:0 6px 18px rgba(0,0,0,.06);
      transition:background-color .15s ease, border-color .15s ease, box-shadow .15s ease, transform .15s ease, color .15s ease;
    }
    .btn:hover, .btn:focus-visible{
      background:#fff; border-color:#dcd4c3; color:var(--accent);
      transform:translateY(-1px); box-shadow:0 12px 22px rgba(0,0,0,.08);
    }
    .btn.alt{ background:transparent; border:1px solid #dcd4c3; color:#3f3a33; }

    /* Page hero (renamed from .hero to avoid global hero-side-effects) */
    .page-hero{
      position:relative; background:linear-gradient(180deg, #fff, #f9f8f6);
      border-bottom:1px solid var(--line);
    }
    .page-hero .container{ padding: clamp(22px, 5.8vw, 54px) var(--gap); }
    .crumb{
      font-family:"Raleway", ui-sans-serif, system-ui; color:#7b7267; font-size:15px; margin:0 0 14px;
      display:inline-flex; align-items:center; gap:8px;
    }
    .crumb a{ border-bottom:1px dotted #cfc7b7; padding-bottom:2px }
    .eyebrow{
      font-family:"Raleway", ui-sans-serif, system-ui; font-weight:600; font-size:14px; letter-spacing:.18em;
      color:#7b7267; text-transform:uppercase; margin-bottom:10px;
    }

    /* Mosaic grid */
    .value{ background:var(--bg); }
    .value .container{ padding: clamp(20px, 4.5vw, 40px) var(--gap) clamp(36px, 6vw, 60px); }
    .value .eyebrow{ margin-bottom:10px; }
    .mosaic{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap: clamp(10px, 2.2vw, 20px);
      align-items:start;
    }
    .tile{
      grid-column: span 6;
      display:grid; grid-template-rows:auto 1fr;
      gap:10px; background:transparent; border:0; padding:0; margin:0;
    }
    .tile-media{
      width:100%; aspect-ratio: 4/3; object-fit:cover; object-position:center;
      border:1px solid var(--line); box-shadow:0 8px 22px rgba(0,0,0,.06);
    }
    .tile .title{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      font-family:"Cormorant Garamond","Playfair Display",serif; font-weight:600;
      font-size:clamp(18px, 2.4vw, 22px); letter-spacing:.01em;
      padding:6px 2px; border:0; background:transparent;
    }

    /* Chevron diamond */
    .diamond{
      display:inline-grid; place-items:center; width:34px; height:34px;
      transform:rotate(45deg);
      background:var(--glass-bg);
      border: var(--glass-border);
      box-shadow: var(--glass-shadow);
      backdrop-filter: var(--glass-blur);
    }
    .diamond .chev{ transform:rotate(-45deg); font-size:16px; line-height:1; }

    /* Tile nav (prev/next) */
    .tile-nav{
      position:absolute; top:50%; transform:translateY(-50%);
      display:flex; align-items:center; justify-content:center;
      width: var(--arrow-size); height: var(--arrow-size);
      border: var(--glass-border);
      background: var(--glass-bg);
      box-shadow: var(--glass-shadow);
      backdrop-filter: var(--glass-blur);
    }
    .tile-nav.left{ left: var(--arrow-inset); }
    .tile-nav.right{ right: var(--arrow-inset); }

    /* Buttons row under grid */
    .cta{
      display:grid; grid-template-columns:repeat(2, minmax(0, 200px)); gap:12px;
      margin:26px 0 6px;
      place-items:center;
    }

    /* Mobile */
    @media (max-width:960px){
      .tile{ grid-column: span 12; }
      .tile .title{ font-size:18px }
      .diamond{ width:30px; height:30px }
      .tile-nav{ opacity:1 !important; transform:translateY(-50%) scale(1) !important; }
    }

    /* Very small screens */
    @media (max-width:740px){
      .mosaic{ grid-template-columns: repeat(1, 1fr); }
      .mosaic .tile{ grid-column:auto !important; }
      .cta{ grid-template-columns:1fr; }
    }
  </style>
</head>

  <script>
    (function(){
      const MAX_IMGS = 10;
      function shuffled(arr){
        const a = arr.slice();
        for(let i=a.length-1;i>0;i--){
          const j = Math.floor(Math.random()*(i+1));
          [a[i],a[j]] = [a[j],a[i]];
        }
        return a;
      }

      // Enhance all .tile figures:
      document.querySelectorAll('.tile').forEach(tile => {
        const preferred = tile.getAttribute('data-preferred') || '';
        const link = tile.getAttribute('data-link') || '#';
        let imgs = [];
        try {
          imgs = JSON.parse(tile.getAttribute('data-all-images') || '[]');
        } catch(e){ imgs = []; }

        // Keep preferred first, then shuffle the rest and cap
        const rest = imgs.filter(src => src !== preferred);
        const ordered = [preferred, ...shuffled(rest)].filter(Boolean).slice(0, MAX_IMGS);

        // Use first as the visible <img>, attach link behavior, add hover chevrons
        const imgEl = tile.querySelector('.tile-media');
        if (ordered[0]) imgEl.src = ordered[0];

        tile.addEventListener('click', (e) => {
          const a = e.target.closest('a');
          if (!a) window.location.href = link;
        });

        // build prev/next rotation just for preview feel
        const left = tile.querySelector('.tile-nav.left');
        const right = tile.querySelector('.tile-nav.right');
        let idx = 0;
        const show = i => { if (ordered[i]) imgEl.src = ordered[i]; }
        left?.addEventListener('click', (e) => {
          e.preventDefault(); e.stopPropagation();
          idx = (idx - 1 + ordered.length) % ordered.length;
          show(idx);
        });
        right?.addEventListener('click', (e) => {
          e.preventDefault(); e.stopPropagation();
          idx = (idx + 1) % ordered.length;
          show(idx);
        });
      });
    })();
  </script>
